tics or exit can raise: older Python'\\''s\n    # implicit exception chaining can loop on an already-cyclic context.\n    if terminal_error is not None:\n        name, diagnostic = \"unknown\", \"unavailable\"\n        try:\n            records = terminal_diagnostic(terminal_error, sys._getframe().f_code)\n            diagnostic = json.dumps(records, separators=(\",\", \":\"))\n            name = records[0][\"type\"]\n        except BaseException:\n            pass  # Diagnostics must never replace the authoritative terminal exit.\n        try:\n            print(f\"::error::Git ownership/setup failed ({name}); refusing reuse or retry\", file=sys.stderr)\n            print(f\"[ci-git-owner] diagnostic={diagnostic}\", file=sys.stderr)\n        except BaseException:\n            pass\n    raise SystemExit(exit_code)\n'\n# End generated CI Git owner.\n"
    - name: Verify exact checkout and workflow
      shell: bash
      env:
        EXPECTED: c7f0d533696fbc7a140614cf84f1961f186a6012
        WORKFLOW: ${{ github.workflow_sha }}
        SIDE: direct-base-and-candidate
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/evidence"

        actual=$(git rev-parse HEAD)

        test "$actual" = "$EXPECTED"

        printf ''CHECKOUT_SHA=%s

        WORKFLOW_SHA=%s

        SIDE=%s

        '' "$actual" "$WORKFLOW" "$SIDE" | tee "$RUNNER_TEMP/evidence/pin.txt"

        git status --porcelain=v1 > "$RUNNER_TEMP/evidence/status-before.txt"

        '
    - name: Setup Node environment
      uses: ./.ci-harness/.github/actions/setup-node-env
      with:
        node-version: 24.22.1
        install-bun: 'false'
        cache-mode: 'off'
        dependency-cache: 'false'
        semantic-checks: 'true'
    - name: Compare and time exact redactors
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/evidence\"\ncat > \"$RUNNER_TEMP/evidence/command.sh\" <<'PROOF_COMMAND'\nset -euo pipefail\nBASE=c7f0d533696fbc7a140614cf84f1961f186a6012\nCANDIDATE=28ffa795b705a1c2322822fec87ad094e6cc3da5\ncandidate_dir=\"$RUNNER_TEMP/candidate-source\"\ngit fetch --no-tags origin \"$CANDIDATE\"\ngit worktree add --detach \"$candidate_dir\" \"$CANDIDATE\"\ntest \"$(git rev-parse HEAD)\" = \"$BASE\"\ntest \"$(git -C \"$candidate_dir\" rev-parse HEAD)\" = \"$CANDIDATE\"\nln -s \"$GITHUB_WORKSPACE/node_modules\" \"$candidate_dir/node_modules\"\nprintf 'BASE=%s\\nCANDIDATE=%s\\n' \"$BASE\" \"$CANDIDATE\" > \"$RUNNER_TEMP/evidence/both-pins.txt\"\nexport CORPUS=\"$RUNNER_TEMP/evidence/corpus.json\"\nexport CANDIDATE_DIR=\"$candidate_dir\"\npython3 - <<'PY'\nimport os,pathlib,json,subprocess,hashlib\nroot=pathlib.Path(os.environ['CANDIDATE_DIR'])\nfiles=set(p for folder in ['src/gateway','src/logging'] for p in (root/folder).rglob('*.ts'))\nfiles.update(root/f for f in ['src/gateway/server.private-completion.test.ts','src/gateway/server.session-row-deltas-unsubscribe.integration.test.ts','src/gateway/server.guest-session-access.test.ts'])\nrows=[]\nfor f in sorted(files):\n for n,line in enumerate(f.read_text().splitlines(),1):rows.append({'file':str(f.relative_to(root)),'line':n,'input':line})\npathlib.Path(os.environ['CORPUS']).write_text(json.dumps(rows))\nprint(json.dumps({'sourceFiles':len(files),'comparedInputs':len(rows)}))\nPY\ncat > \"$RUNNER_TEMP/side.mts\" <<'JS'\nimport fs from 'node:fs';\nimport { pathToFileURL } from 'node:url';\nimport { performance } from 'node:perf_hooks';\nimport assert from 'node:assert/strict';\nconst {redactSensitiveText}=await import(pathToFileURL(process.cwd()+'/src/logging/redact.ts').href);\nconst rows=JSON.parse(fs.readFileSync(process.env.CORPUS!,'utf8'));\nconst opts={mode:'tools' as const};\nconst outputs=[];\nfor(const row of rows){const out=await redactSensitiveText(row.input,opts);assert.equal(typeof out,'string');if(row.input.length)assert.ok(out.length);outputs.push(out);}\nassert.equal(outputs.length,rows.length);\nconsole.log(JSON.stringify({side:process.env.SIDE,inputLines:rows.length,outputLines:outputs.length}));\nfs.writeFileSync(process.env.OUTPUT!,JSON.stringify(outputs));\nif(process.env.SMOKE==='1')process.exit(0);\nconst timing=[];\nfor(const [kind,seed] of [['no-pass','ordinary words without keyword here. '],['pass-space','pass '],['pass-colon-prose','pass: ordinary words repeat here. ']]){\n for(const size of [1000000,2000000]){\n  const input=seed.repeat(Math.ceil(size/seed.length)).slice(0,size);assert.equal(Buffer.byteLength(input),size);\n  await redactSensitiveText(input.slice(0,1000),opts);\n  const ms=[];\n  for(let n=0;n<5;n++){const start=performance.now();const out=await redactSensitiveText(input,opts);ms.push(performance.now()-start);assert.equal(typeof out,'string');assert.ok(out.length);}\n  const median=[...ms].sort((a,b)=>a-b)[2];timing.push({kind,bytes:size,ms,medianMs:median});\n }\n}\nfs.writeFileSync(process.env.TIMING!,JSON.stringify(timing,null,2));\nJS\ncat > \"$RUNNER_TEMP/liveness.mts\" <<'LIVENESS'\nimport assert from 'node:assert/strict';\nimport {pathToFileURL} from 'node:url';\nconst b=await import(pathToFileURL(process.cwd()+'/src/logging/redact.ts').href);\nconst c=await import(pathToFileURL(process.env.CANDIDATE_DIR+'/src/logging/redact.ts').href);\nconst known=[\"At 17:34 the review found one thing for the UX pass: the screen shows two buttons.\", \"11:1x Builder done, first pass: the batch is complete.\", \"250:- Second pass: retry is fine.\", \"At 7:04:09 the review finished, first pass: the screen is ready.\", \"At 17:xx the review finished, first pass: the screen is ready.\", \"At 17:34 the review finished.\\n250:- Second pass: retry is fine.\"];\nlet changed=0;\nfor(const input of known){const x=await b.redactSensitiveText(input,{mode:'tools'});const y=await c.redactSensitiveText(input,{mode:'tools'});assert.equal(typeof x,'string');assert.equal(typeof y,'string');assert.ok(x.length&&y.length);if(x!==y)changed++;}\nconsole.log(JSON.stringify({knownRegressionInputs:known.length,changed}));assert.ok(changed>0,'candidate must differ on a known regression input');\n\nLIVENESS\nnode --import tsx \"$RUNNER_TEMP/liveness.mts\"\n# Run the same script serially; resolve tsx through the installed base dependency tree.\nexport SIDE=base\nexport OUTPUT=\"$RUNNER_TEMP/evidence/base-output.json\" TIMING=\"$RUNNER_TEMP/evidence/base-time.json\"\nnode --import tsx \"$RUNNER_TEMP/side.mts\"\nexport SIDE=candidate\nexport OUTPUT=\"$RUNNER_TEMP/evidence/candidate-output.json\" TIMING=\"$RUNNER_TEMP/evidence/candidate-time.json\"\n(cd \"$candidate_dir\" && node --import tsx \"$RUNNER_TEMP/side.mts\")\npython3 - <<'PY'\nimport json,os,pathlib\nr=pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence'\nrows=json.loads((r/'corpus.json').read_text());b=json.loads((r/'base-output.json').read_text());c=json.loads((r/'candidate-output.json').read_text());assert len(rows)==len(b)==len(c)\ndiffs=[dict(row,base=x,candidate=y) for row,x,y in zip(rows,b,c) if x!=y]\n(r/'differences.json').write_text(json.dumps(diffs,indent=2))\n# Keep every difference for semantic classification; do not auto-clear prose by a broad regex.\nsummary={'baseInputLines':len(rows),'candidateInputLines':len(rows),'baseOutputLines':len(b),'candidateOutputLines':len(c),'linesCompared':len(rows),'differentLines':len(diffs),'first30':diffs[:30]}\nprint('DIRECT_DIFFERENCE '+json.dumps(summary))\nbt=json.loads((r/'base-time.json').read_text());ct=json.loads((r/'candidate-time.json').read_text());table=[];findings=[]\nfor x,y in zip(bt,ct):\n assert (x['kind'],x['bytes'])==(y['kind'],y['bytes'])\n ratio=y['medianMs']/x['medianMs'];line={'kind':x['kind'],'bytes':x['bytes'],'baseMedianMs':x['medianMs'],'candidateMedianMs':y['medianMs'],'candidateOverBase':ratio};table.append(line)\n if ratio>2:findings.append({'rule':'candidate-over-base>2',**line})\nfor kind in {x['kind'] for x in ct}:\n a,z=[x for x in ct if x['kind']==kind];ratio=z['medianMs']/a['medianMs']\n if ratio>3:findings.append({'rule':'candidate-doubling>3','kind':kind,'ratio':ratio})\nsummary.update(timing=table,timingFindings=findings)\n(r/'direct-summary.json').write_text(json.dumps(summary,indent=2))\nprint('DIRECT_TIME '+json.dumps(table));print('TIMING_FINDINGS '+json.dumps(findings))\nif findings:raise SystemExit(1)\nPY\n\nPROOF_COMMAND\nset +e\nbash -e -o pipefail \"$RUNNER_TEMP/evidence/command.sh\" 2>&1 | tee \"$RUNNER_TEMP/evidence/raw.log\"\ncodes=(\"${PIPESTATUS[@]}\")\nset -e\nprintf '{\"exit\":%s,\"teeExit\":%s}\\n' \"${codes[0]}\" \"${codes[1]}\" > \"$RUNNER_TEMP/evidence/exit.json\"\nif (( codes[1] != 0 )); then exit \"${codes[1]}\"; fi\nexit \"${codes[0]}\"\n"
    - name: Seal raw evidence
      if: ${{ always() }}
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/evidence"

        git status --porcelain=v1 > "$RUNNER_TEMP/evidence/status-after.txt"

        cd "$RUNNER_TEMP/evidence"

        find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS

        '
    - name: Upload direct matcher evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: direct-matcher
        path: ${{ runner.temp }}/evidence
        if-no-files-found: error
