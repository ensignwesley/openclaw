    - name: Record exact paired checkout and workflow
      shell: bash
      env:
        EXPECTED_CHECKOUT: ${{ matrix.paired_checkout }}
        PAIRED_SIDE: ${{ matrix.paired_side }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/final-evidence"

        actual=$(git rev-parse HEAD)

        test "$actual" = "$EXPECTED_CHECKOUT"

        printf ''CHECKOUT_SHA=%s

        WORKFLOW_SHA=%s

        SIDE=%s

        '' "$actual" "$WORKFLOW_SHA" "$PAIRED_SIDE" | tee "$RUNNER_TEMP/final-evidence/pin.txt"

        git status --porcelain=v1 > "$RUNNER_TEMP/final-evidence/status-before.txt"

        '
    - name: Setup Node environment
      id: node_setup
      uses: ./.ci-harness/.github/actions/setup-node-env
      with:
        cache-mode: ${{ needs.preflight.outputs.cache_mode }}
        node-version: 24.22.1
        install-bun: 'false'
        dependency-cache: ${{ needs.preflight.outputs.effective_runner_backend == 'boat' && 'false' || ((github.run_attempt != 1 && (needs.preflight.outputs.ci_qualification == 'true' || needs.preflight.outputs.effective_runner_backend == 'boat') && 'github' || needs.preflight.outputs.placement_runner_backend) == 'github' || runner.environment != 'self-hosted' || (github.event_name == 'workflow_dispatch' && ((needs.preflight.outputs.node_runner_backend != 'runson' && needs.preflight.outputs.ci_qualification != 'true') || github.run_attempt != 1)) || (github.event_name == 'pull_request' && github.run_attempt > 1)) && 'false' || (github.repository == 'openclaw/openclaw' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'openclaw/openclaw') && 'true' || 'false') }}
        build-all-cache-scope: full
    - name: Install Playwright Chromium
      id: ui_chromium
      uses: ./.ci-harness/.github/actions/setup-playwright-chromium
      with:
        cache-mode: ${{ needs.preflight.outputs.cache_mode }}
        compatibility-target: ${{ needs.preflight.outputs.compatibility_target }}
    - name: Build runtime and Control UI artifacts for real-Gateway tests
      id: real_gateway_build
      if: ${{ !cancelled() && steps.node_setup.outcome == 'success' }}
      env:
        OPENCLAW_BUILD_PRIVATE_QA: '1'
        OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: '1'
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/final-evidence"

        cat > "$RUNNER_TEMP/final-evidence/step-04.sh" <<''FINAL_COMMAND''

        pnpm build

        FINAL_COMMAND

        set +e

        bash -e -o pipefail "$RUNNER_TEMP/final-evidence/step-04.sh" 2>&1 | tee "$RUNNER_TEMP/final-evidence/step-04.log"

        codes=("${PIPESTATUS[@]}")

        set -e

        printf ''actual_exit=%s\ntee_exit=%s\n'' "${codes[0]}" "${codes[1]}" > "$RUNNER_TEMP/final-evidence/step-04.exit"

        if (( codes[1] != 0 )); then exit "${codes[1]}"; fi

        exit "${codes[0]}"

        '
      shell: bash
    - name: Test Control UI suites with a real Gateway
      if: ${{ !cancelled() && steps.real_gateway_build.outcome == 'success' && steps.ui_chromium.outcome == 'success' && matrix.run_tests }}
      env:
        FROZEN_TARGET: ${{ needs.preflight.outputs.frozen_target }}
        OPENCLAW_CAPTURE_UI_PROOF: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_ui_proof && '1' || '0' }}
        OPENCLAW_UI_E2E_ARTIFACT_DIR: .artifacts/control-ui-e2e/real-gateway
        OPENCLAW_UI_E2E_DIAGNOSTIC_DIR: .artifacts/control-ui-e2e-timeouts/real-gateway-attempt-${{ github.run_attempt }}
        OPENCLAW_NODE_TEST_GROUPS_GZIP_BASE64: ''
        OPENCLAW_UI_E2E_RUN_DESKTOP: ${{ matrix.run_desktop }}
        DESKTOP_PROOF_CHECKOUT_SHA: ${{ matrix.paired_checkout }}
        DESKTOP_PROOF_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        DESKTOP_PROOF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        DESKTOP_PROOF_WORKFLOW_SHA: ${{ github.workflow_sha }}
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/final-evidence"

        printf ''%s\n'' ''["extensions/qa-lab/src/control-ui-automation-management.real-gateway.e2e.test.ts", "extensions/qa-lab/src/control-ui-openclaw-delegation.real-gateway.e2e.test.ts"]'' > "$RUNNER_TEMP/clock-exact-include.json"

        export OPENCLAW_VITEST_INCLUDE_FILE="$RUNNER_TEMP/clock-exact-include.json"

        set +e

        node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-e2e-prebuilt.config.ts --configLoader runner --reporter verbose extensions/qa-lab/src/control-ui-automation-management.real-gateway.e2e.test.ts extensions/qa-lab/src/control-ui-openclaw-delegation.real-gateway.e2e.test.ts 2>&1 | tee "$RUNNER_TEMP/final-evidence/exact-tests.log"

        codes=("${PIPESTATUS[@]}")

        set -e

        printf ''actual_exit=%s\ntee_exit=%s\n'' "${codes[0]}" "${codes[1]}" > "$RUNNER_TEMP/final-evidence/exact-tests.exit"

        if (( codes[1] != 0 )); then exit "${codes[1]}"; fi

        exit "${codes[0]}"

        '
      shell: bash
    - name: Upload Control UI real-Gateway failure diagnostics
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: control-ui-real-gateway-timeout-${{ github.run_attempt }}-${{ matrix.shard }}
        path: '.artifacts/control-ui-e2e-timeouts/real-gateway-attempt-${{ github.run_attempt }}/failure-*/failure.public.json

          '
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload quota auth and transport diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: control-ui-quota-diagnostics-${{ github.run_attempt }}-${{ matrix.shard }}
        path: .artifacts/control-ui-e2e/real-gateway/quota-refresh-*/quota.public.json
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload sanitized desktop resize proof
      if: always() && matrix.run_desktop
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: desktop-resize-proof-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/control-ui-e2e/real-gateway/desktop-resize
        if-no-files-found: warn
        retention-days: 14
    - name: Upload model picker public observations
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: model-picker-public-proof-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
        path: .artifacts/control-ui-e2e/real-gateway/model-picker-public-*
        if-no-files-found: warn
        retention-days: 14
    - name: Upload sanitized Control UI real-Gateway proof
      if: always() && github.event_name == 'workflow_dispatch' && inputs.capture_ui_proof
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: control-ui-real-gateway-proof-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
        path: .artifacts/control-ui-e2e/real-gateway
        if-no-files-found: error
        retention-days: 14
    - name: Seal final comparison evidence
      if: ${{ always() }}
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/final-evidence"

        git status --porcelain=v1 > "$RUNNER_TEMP/final-evidence/status-after.txt"

        cd "$RUNNER_TEMP/final-evidence"

        find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS

        '
    - name: Upload final paired evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: checks-ui-e2e-real-gateway-${{ matrix.paired_side }}
        path: ${{ runner.temp }}/final-evidence
        if-no-files-found: error
'on':
  workflow_dispatch:
    inputs:
      target_ref:
        description: Optional branch, tag, or full commit SHA to validate instead of the workflow ref
        required: false
        default: ''
        type: string
      runner_backend:
        description: Qualify runners on an exact PR head or main revision.
        required: false
        default: default
        type: choice
        options:
        - default
        - hybrid
        - runson
        - boat
      ci_shape:
        description: Use main coverage for an admitted qualification; otherwise keep default coverage.
        required: false
        default: default
        type: choice
        options:
        - default
        - main
      test_runtime_policy:
        description: Linux test runtime override (node, bun-all, or dual-all); empty uses Bun for daily CI and both runtimes for full validation.
        required: false
        default: ''
        type: string
      capture_ui_proof:
        description: Capture and upload sanitized Control UI screenshots from real-Gateway tests.
        required: false
        default: false
        type: boolean
      include_android:
        description: Run Android lanes for this manual CI dispatch.
        required: false
        default: false
        type: boolean
      validation_tier:
        description: Full release coverage, or complete main coverage without release-only proofs.
        required: false
        default: full
        type: choice
        options:
        - full
        - main
      release_scope:
        description: Release qualification scope; npm-beta and npm-stable defer native apps for a validated exact release target.
        required: false
        default: full
        type: choice
        options:
        - full
        - npm-beta
        - npm-stable
      release_gate:
        description: Run an exact-SHA maintainer release-gate fallback when PR CI is capacity-stalled.
        required: false
        default: false
        type: boolean
      pull_request_number:
        description: Pull request number required by the exact-SHA release gate.
        required: false
        default: ''
        type: string
      qualification_baselines_json:
        description: Captured exact upgrade and survivor baselines from the qualification request
        required: false
        default: ''
        type: string
      dispatch_id:
        description: Optional parent workflow dispatch identifier
        required: false
        default: ''
        type: string
      historical_target_tag:
        description: Semver release tag authorizing compatibility fallbacks for its exact commit
        required: false
        default: ''
        type: string
      release_candidate_ref:
        description: Canonical release branch authorizing compatibility fallbacks for its exact head
        required: false
        default: ''
        type: string
      target_context_ref:
        description: Canonical release branch context authorizing compatibility fallbacks for an exact-SHA target
        required: false
        default: ''
        type: string
