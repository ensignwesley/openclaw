          scripts/lib/managed-cleanup-handoff.mts

          scripts/lib/numeric-options.mjs

          scripts/lib/vitest-outcome.mts

          scripts/lib/vitest-plan-scheduling.mts

          scripts/lib/vitest-local-scheduling.mts

          scripts/lib/vitest-resource-ownership.mts

          scripts/lib/windows-taskkill.mjs

          scripts/windows-cmd-helpers.mjs

          scripts/lib/arg-utils.mts

          scripts/lib/arg-utils.runtime.mjs

          '
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - name: Build Node test runtime
      id: node-test-runtime
      if: matrix.pretest_build_mode != null
      env:
        NODE_OPTIONS: --max-old-space-size=8192
        OPENCLAW_BUILD_PRIVATE_QA: ${{ matrix.pretest_build_mode == 'private-qa' && '1' || '0' }}
        VITEST: '1'
      run: pnpm build qaRuntime
    - name: Install ripgrep for native grep tests
      if: matrix.requires_ripgrep == true && runner.os == 'Linux'
      uses: ./.ci-harness/.github/actions/setup-ripgrep
    - name: Prepare Docker sandbox image
      if: matrix.requires_sandbox_image == true && runner.os == 'Linux'
      shell: bash
      run: "if ! docker image inspect openclaw-sandbox:trixie-slim >/dev/null 2>&1; then\n  scripts/sandbox-setup.sh\nfi\n"
    - name: Configure Node test resources
      env:
        PREDICTED_TEST_SECONDS: ${{ matrix.predicted_seconds || '' }}
        SHARD_PLAN_CONCURRENCY: ${{ matrix.plan_concurrency || '' }}
        OPENCLAW_NODE_TEST_CPU_BUDGET: ${{ needs.preflight.outputs.effective_runner_backend == 'boat' && github.run_attempt == 1 && matrix.cpu_budget || '' }}
        FROZEN_TARGET: ${{ needs.preflight.outputs.frozen_target }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
        RUNSON_JOB: ${{ (matrix.runner == 'runson-c8i-8xlarge' || startsWith(matrix.check_name, 'checks-node-runson-cron-')) && 'true' || 'false' }}
      run: "actual_cores=\"$(nproc)\"\ncores=\"$actual_cores\"\nif [[ -n \"$OPENCLAW_NODE_TEST_CPU_BUDGET\" && \"$cores\" -gt \"$OPENCLAW_NODE_TEST_CPU_BUDGET\" ]]; then\n  cores=\"$OPENCLAW_NODE_TEST_CPU_BUDGET\"\nfi\necho \"OPENCLAW_NODE_TEST_CPU_BUDGET=$OPENCLAW_NODE_TEST_CPU_BUDGET\" >> \"$GITHUB_ENV\"\nif [ \"$RUNSON_JOB\" = \"true\" ]; then\n  workers=2\nelif [ \"$SHARD_PLAN_CONCURRENCY\" != \"1\" ]; then\n  workers=2\nelif [ \"$cores\" -ge 12 ]; then\n  workers=6\nelif [ \"$cores\" -ge 6 ]; then\n  workers=4\nelse\n  workers=3\nfi\nif [[ \"$RUNSON_JOB\" != \"true\" && \"$RUNNER_ENVIRONMENT\" == \"self-hosted\" && \"$FROZEN_TARGET\" != \"true\" && \"$SHARD_PLAN_CONCURRENCY\" == \"1\" ]]; then\n  workers=\"$(CI_LEGACY_WORKERS=\"$workers\" node --input-type=module <<'JS'\nimport { isConstrainedCiCheckHost } from './scripts/lib/local-check-runtime.mts';\nimport { detectVitestHostInfo, resolveLocalVitestScheduling } from './scripts/lib/vitest-local-scheduling.mts';\nconst host = detectVitestHostInfo();\nif (process.env.OPENCLAW_NODE_TEST_CPU_BUDGET) {\n  host.cpuCount = Math.min(host.cpuCount, Number(process.env.OPENCLAW_NODE_TEST_CPU_BUDGET));\n}\nconst constrained = isConstrainedCiCheckHost({\n  logicalCpuCount: host.cpuCount,\n  totalMemoryBytes: host.totalMemoryBytes,\n});\nconsole.log(String(constrained ? process.env.CI_LEGACY_WORKERS : resolveLocalVitestScheduling(process.env, host).maxWorkers));\nJS\n  )\"\nfi\nif [ \"$workers\" -gt \"$cores\" ]; then\n  workers=\"$cores\"\nfi\necho \"detected cores=$actual_cores budgeted cores=$cores plan_concurrency=${SHARD_PLAN_CONCURRENCY:-default} predicted_test_seconds=${PREDICTED_TEST_SECONDS:-unknown} -> workers=$workers\"\necho \"OPENCLAW_VITEST_MAX_WORKERS=$workers\" >> \"$GITHUB_ENV\"\n"
    - name: Resolve pooled Node test groups
      id: node-test-groups
      if: matrix.groups_pool
      env:
        GROUP_POOL: ${{ fromJSON(needs.preflight.outputs.node_test_group_pools_json)[matrix.groups_pool] }}
        GROUP_INDEX: ${{ matrix.groups_index }}
      run: "node --input-type=module <<'JS'\nimport { appendFileSync } from 'node:fs';\nimport { decodeNodeTestGroups, encodeNodeTestGroups } from './scripts/lib/ci-node-test-groups-codec.mts';\nconst groups = decodeNodeTestGroups(process.env.GROUP_POOL)[Number(process.env.GROUP_INDEX)];\nif (!Array.isArray(groups)) {\n  throw new Error('Node test group pool does not contain the selected row');\n}\nappendFileSync(process.env.GITHUB_OUTPUT, `groups_gzip_base64=${encodeNodeTestGroups(groups)}\\n`);\nJS\n"
    - name: Download adaptive CI priors
      if: ${{ github.repository == 'openclaw/openclaw' && needs.preflight.outputs.frozen_target == 'false' && matrix.adaptive_observations == true && (github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && endsWith(github.run_id, '0'))) }}
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ci-adaptive-priors-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts
    - name: Run Node test shard
      env:
        BOAT_TEST_RUNNER: ${{ github.run_attempt == 1 && startsWith(matrix.runner_label || matrix.runner, 'boat') }}
        CHECKOUT_BASE_SHA: ${{ needs.preflight.outputs.diff_base_revision }}
        NODE_OPTIONS: --max-old-space-size=8192
        OPENCLAW_CI_TEST_OBSERVATIONS_DIR: ${{ github.repository == 'openclaw/openclaw' && needs.preflight.outputs.frozen_target == 'false' && (github.event_name == 'schedule' || (github.event_name == 'pull_request' && endsWith(github.run_id, '0'))) && format('{0}/ci-test-observations', runner.temp) || '' }}
        OPENCLAW_CI_TEST_AUDIT_CLI_DIR: ${{ github.repository == 'openclaw/openclaw' && needs.preflight.outputs.frozen_target == 'false' && github.event_name == 'schedule' && github.run_attempt == 1 && matrix.audit_cli_observations == true && format('{0}/ci-test-observations-audit-cli', runner.temp) || '' }}
        OPENCLAW_E2E_USE_PREBUILT_DIST: ${{ steps.node-test-runtime.outcome == 'success' && matrix.pretest_build_mode == 'private-qa' && '1' || '' }}
        OPENCLAW_CI_TEST_RUNTIME: ${{ matrix.test_runtime }}
        OPENCLAW_CI_TEST_RUNTIME_POLICY: ${{ matrix.test_runtime_policy || 'node' }}
        FROZEN_TARGET: ${{ needs.preflight.outputs.frozen_target }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
        OPENCLAW_NODE_TEST_GROUPS_GZIP_BASE64: ${{ matrix.groups_pool && steps.node-test-groups.outputs.groups_gzip_base64 || matrix.groups_gzip_base64 || '' }}
        OPENCLAW_NODE_TEST_GROUPS_JSON: ${{ matrix.groups && toJson(matrix.groups) || '' }}
        OPENCLAW_NODE_TEST_CONFIGS_JSON: ${{ toJson(matrix.configs) }}
        OPENCLAW_NODE_TEST_ENV_JSON: ${{ toJson(matrix.env) }}
        OPENCLAW_NODE_TEST_INCLUDE_PATTERNS_JSON: ${{ toJson(matrix.includePatterns) }}
        OPENCLAW_NODE_TEST_TARGETS_JSON: ${{ toJson(matrix.targets) }}
        OPENCLAW_NODE_TEST_VITEST_ARGS_JSON: ${{ needs.preflight.outputs.compatibility_target == 'true' && '["--hookTimeout=600000"]' || '[]' }}
        OPENCLAW_VITEST_SHARD_NAME: ${{ matrix.shard_name }}
        OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: ${{ needs.preflight.outputs.compatibility_target == 'true' && '660000' || '300000' }}
        OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: ${{ matrix.plan_concurrency }}
      shell: bash
      run: "set -euo pipefail\nrunner=\"scripts/ci-run-node-test-shard.mts\"\nif [[ ! -f \"$runner\" ]]; then\n  runner=\".ci-workflow/${runner}\"\n  [[ -f \"$runner\" ]]\nfi\nprefix=()\nif [[ \"$BOAT_TEST_RUNNER\" == \"true\" ]]; then\n  # Boat CI runners inherit read/search bypass; tests need ordinary Unix permissions.\n  prefix=(setpriv --inh-caps=-dac_read_search --ambient-caps=-dac_read_search)\nfi\nmkdir -p \"$RUNNER_TEMP/paired-evidence\"\nprintf '%s\\n' 'CHECKOUT_SHA=${{ matrix.paired_checkout }}' 'WORKFLOW_SHA=${{ github.workflow_sha }}' 'SIDE=${{ matrix.paired_side }}' 'REPEAT=${{ matrix.paired_repeat }}' > \"$RUNNER_TEMP/paired-evidence/pin.txt\"\ngit rev-parse HEAD >> \"$RUNNER_TEMP/paired-evidence/pin.txt\"\nset +e\n{ time -p \"${prefix[@]}\" node --import tsx \"$runner\"; } 2>&1 | tee \"$RUNNER_TEMP/paired-evidence/shard.log\"\nproof_status=${PIPESTATUS[0]} tee_status=${PIPESTATUS[1]}\nset -e\nprintf '{\"exit\":%s,\"teeExit\":%s}\\n' \"$proof_status\" \"$tee_status\" > \"$RUNNER_TEMP/paired-evidence/exit.json\"\nsha256sum \"$RUNNER_TEMP/paired-evidence/\"* > \"$RUNNER_TEMP/paired-evidence.sha256\"\nif [ \"$tee_status\" -ne 0 ]; then exit \"$tee_status\"; fi\nexit \"$proof_status\"\n"
    - name: Upload adaptive CI observations
      if: ${{ always() && github.repository == 'openclaw/openclaw' && needs.preflight.outputs.frozen_target == 'false' && (github.event_name == 'schedule' || (github.event_name == 'pull_request' && endsWith(github.run_id, '0'))) }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ci-test-observations-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
        path: '${{ runner.temp }}/ci-test-observations/*/observations.json

          ${{ runner.temp }}/ci-test-observations/*/launch.json

          '
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload CLI audit observations
      if: ${{ always() && github.repository == 'openclaw/openclaw' && needs.preflight.outputs.frozen_target == 'false' && github.event_name == 'schedule' && github.run_attempt == 1 && matrix.audit_cli_observations == true }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ci-test-observations-audit-cli-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
        path: '${{ runner.temp }}/ci-test-observations-audit-cli/*/observations.json

          ${{ runner.temp }}/ci-test-observations-audit-cli/*/launch.json

          '
        if-no-files-found: ignore
        retention-days: 7
    - name: Record runner memory peak
      if: always()
      shell: bash
      run: "# Absolute high-water mark for the runner cgroup and its descendants, including setup.\nif ! node --input-type=module <<'NODE'\ntry {\n  const { readProcessCgroupV2Snapshot } = await import(\"./.ci-harness/scripts/lib/process-memory.mts\");\n  const peak = readProcessCgroupV2Snapshot()?.[0]?.counters[\"memory.peak\"]?.trim();\n  console.log(/^\\d+$/.test(peak ?? \"\")\n    ? `runner cgroup peak memory bytes=${peak}`\n    : \"runner cgroup peak memory unavailable\");\n} catch {\n  console.log(\"runner cgroup peak memory unavailable\");\n}\nNODE\nthen\n  echo \"runner cgroup peak memory unavailable\"\nfi\n"
    - name: Save docs i18n Go cache
      if: always() && matrix.requires_go == true && needs.preflight.outputs.cache_write_allowed == 'true' && steps.docs-i18n-go-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.docs-i18n-go-cache-key.outputs.paths }}
        key: ${{ steps.docs-i18n-go-cache.outputs.cache-primary-key }}
    - name: Preserve paired raw log and actual exit
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: paired-${{ matrix.check_name }}
        path: '${{ runner.temp }}/paired-evidence/

          ${{ runner.temp }}/paired-evidence.sha256'
        if-no-files-found: error
'on':
  workflow_dispatch:
    inputs:
      target_ref:
        description: Optional branch, tag, or full commit SHA to validate instead of the workflow ref
        required: false
        default: ''
        type: string
      runner_backend:
        description: Qualify runners on an exact PR head or main revision.
        required: false
        default: default
        type: choice
        options:
        - default
        - hybrid
        - runson
        - boat
      ci_shape:
        description: Use main coverage for an admitted qualification; otherwise keep default coverage.
        required: false
        default: default
        type: choice
        options:
        - default
        - main
      test_runtime_policy:
        description: Linux test runtime override (node, bun-all, or dual-all); empty uses Bun for daily CI and both runtimes for full validation.
        required: false
        default: ''
        type: string
      capture_ui_proof:
        description: Capture and upload sanitized Control UI screenshots from real-Gateway tests.
        required: false
        default: false
        type: boolean
      include_android:
        description: Run Android lanes for this manual CI dispatch.
        required: false
        default: false
        type: boolean
      validation_tier:
        description: Full release coverage, or complete main coverage without release-only proofs.
        required: false
        default: full
        type: choice
        options:
        - full
        - main
      release_scope:
        description: Release qualification scope; npm-beta and npm-stable defer native apps for a validated exact release target.
        required: false
        default: full
        type: choice
        options:
        - full
        - npm-beta
        - npm-stable
      release_gate:
        description: Run an exact-SHA maintainer release-gate fallback when PR CI is capacity-stalled.
        required: false
        default: false
        type: boolean
      pull_request_number:
        description: Pull request number required by the exact-SHA release gate.
        required: false
        default: ''
        type: string
      qualification_baselines_json:
        description: Captured exact upgrade and survivor baselines from the qualification request
        required: false
        default: ''
        type: string
      dispatch_id:
        description: Optional parent workflow dispatch identifier
        required: false
        default: ''
        type: string
      historical_target_tag:
        description: Semver release tag authorizing compatibility fallbacks for its exact commit
        required: false
        default: ''
        type: string
      release_candidate_ref:
        description: Canonical release branch authorizing compatibility fallbacks for its exact head
        required: false
        default: ''
        type: string
      target_context_ref:
        description: Canonical release branch context authorizing compatibility fallbacks for an exact-SHA target
        required: false
        default: ''
        type: string
