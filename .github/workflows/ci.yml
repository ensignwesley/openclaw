      run: "set -euo pipefail\npython_command=python3\nif [ \"$RUNNER_OS\" = \"Windows\" ]; then\n  python_command=python\nfi\nrun_owner() {\n  if [ \"$RUNNER_OS\" = \"Linux\" ] || [ \"$RUNNER_OS\" = \"Windows\" ]; then\n    # Keep trusted code outside the checkout and below Windows argv limits.\n    printf '%s' \"$1\" > \"$RUNNER_TEMP/ci-git-owner.py\"\n    exec \"$python_command\" -I -S \"$RUNNER_TEMP/ci-git-owner.py\"\n  fi\n  exec \"$python_command\" -I -S -c \"$1\"\n}\n# Generated from .github/actions/git-owner/owner.py; do not edit here.\nrun_owner 'import base64\nimport builtins\nimport json\nimport os\nimport re\nimport runpy\nimport shutil\nimport signal\nimport subprocess\nimport sys\nimport tempfile\nimport time\nfrom types import TracebackType\n\nlinux = os.environ.get(\"RUNNER_OS\", sys.platform) in (\"Linux\", \"linux\")\nfetch_timeout_seconds = 120 if linux else 90\ncleanup_seconds = 10\ncancelled = 0\nclosed = False\ngit = shutil.which(\"git\")\ncheckout_environment = {}\n\n\ndef lifetime_fds(environment):\n    # Native children and their hooks/helpers share the enclosing PR lifetime.\n    if os.name == \"nt\":\n        return ()\n    return ((7,) if environment.get(\"OPENCLAW_PR_LIFETIME_FILE\") else ()) + tuple(\n        item[\"fd\"] for item in json.loads(environment.get(\"OPENCLAW_PR_LIFETIME_ANCESTORS\", \"[]\")))\n\n\ndef cancel(signum, _frame):\n    global cancelled\n    cancelled = signum\n\n\nfor signame in (\"SIGINT\", \"SIGTERM\", \"SIGHUP\", \"SIGBREAK\"):\n    if hasattr(signal, signame):\n        signal.signal(getattr(signal, signame), cancel)\n\n\ndef check_cancelled():\n    if cancelled:\n        raise SystemExit(128 + cancelled)\n\n\n# The bootstrap inherits only this Job handle and stdio, joins before spawning Git,\n# then closes its copy. Even owner death before assignment kills it on that close.\nwindows_api = '\\'''\\'''\\''\nimport ctypes as c\nfrom ctypes import wintypes as w\nimport os, subprocess, sys\nkernel = c.WinDLL(\"ker