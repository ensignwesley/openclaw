    - name: Initialize RunsOn
      if: matrix.runner == 'runson-c8i-8xlarge' && runner.environment == 'self-hosted'
      uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3
    - name: Record RunsOn allocation
      if: matrix.runner == 'runson-c8i-8xlarge' && runner.environment == 'self-hosted'
      shell: bash
      run: "set -euo pipefail\nimds_token=\"$(curl -fsS --connect-timeout 2 --max-time 5 -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)\"\nfor fact in instance-type instance-life-cycle placement/region; do\n  value=\"$(curl -fsS --connect-timeout 2 --max-time 5 -H \"X-aws-ec2-metadata-token: $imds_token\" \"http://169.254.169.254/latest/meta-data/$fact\")\"\n  echo \"RUNSON_ALLOCATION $fact=$value\"\n  case \"$fact\" in\n    instance-type) test \"$value\" = c8i.8xlarge ;;\n    instance-life-cycle) [[ \"$value\" == spot || \"$value\" == on-demand ]] ;;\n    placement/region) test \"$value\" = us-east-1 ;;\n  esac\ndone\necho \"RUNSON_ALLOCATION launched_at=${RUNS_ON_INSTANCE_LAUNCHED_AT:-unknown}\"\n# c8i uses EBS; do not claim the pilot's unmeasured c8id NVMe path.\nfindmnt -T /tmp -o TARGET,SOURCE,FSTYPE\n"
    - name: Setup Node environment
      uses: ./.ci-harness/.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        cache-mode: ${{ needs.preflight.outputs.cache_mode }}
        node-version: ${{ (matrix.runner == 'runson-c8i-8xlarge' || startsWith(matrix.check_name, 'checks-node-runson-cron-')) && env.NODE_VERSION || matrix.node_version || '24.22.1' }}
        native-secret-service: ${{ matrix.requires_native_secret_service == true && 'true' || 'false' }}
        install-bun: 'false'
        dependency-cache: ${{ needs.preflight.outputs.effective_runner_backend == 'boat' && 'false' || ((github.run_attempt != 1 && (needs.preflight.outputs.ci_qualification == 'true' || needs.preflight.outputs.effective_runner_backend == 'boat') && 'github' || needs.preflight.outputs.placement_runner_backend) == 'github' || runner.environment != 'self-hosted' || (github.event_name == 'workflow_dispatch' && ((needs.preflight.outputs.node_runner_backend != 'runson' && needs.preflight.outputs.ci_qualification != 'true') || github.run_attempt != 1)) || (github.event_name == 'pull_request' && github.run_attempt > 1)) && 'false' || (github.repository == 'openclaw/openclaw' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'openclaw/openclaw') && 'true' || 'false') }}
        vitest-fs-cache: 'true'
        vitest-worker-cache: ${{ needs.preflight.outputs.frozen_target != 'true' && matrix.pretest_build_mode == null && (matrix.node_version == null || matrix.node_version == '24.x') && 'true' || 'false' }}
        vitest-worker-preset: ${{ matrix.worker_cache_preset || 'full' }}
        node-compile-cache: 'true'
    - name: Apply frozen Node test compatibility
      if: needs.preflight.outputs.checkout_revision == 'f773aa06a1a93b36b050f1a3f4b57d3d91311541'
      uses: ./.ci-harness/.github/actions/frozen-node-test-compat
      with:
        target-sha: ${{ needs.preflight.outputs.checkout_revision }}
    - name: Setup pinned Bun test runtime
      if: matrix.requires_bun == true
      uses: ./.ci-harness/.github/actions/setup-test-bun
      with:
        cache-mode: ${{ needs.preflight.outputs.cache_mode }}
    - name: Setup Go for docs i18n
      if: matrix.requires_go == true
      uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
      with:
        go-version: 1.27.3
        cache: false
    - name: Resolve docs i18n Go cache
      id: docs-i18n-go-cache-key
      if: matrix.requires_go == true && needs.preflight.outputs.cache_mode != 'off'
      env:
        DEPENDENCY_HASH: ${{ hashFiles('scripts/docs-i18n/go.sum') }}
      run: "set -euo pipefail\narch=\"$(node -p process.arch)\"\nimage_prefix=\"\"\nif [[ \"$RUNNER_OS\" == \"Linux\" ]]; then\n  image_prefix=\"${ImageOS-undefined}-\"\nfi\nversion=\"$(go env GOVERSION)\"\n{\n  echo \"key=setup-go-${RUNNER_OS}-${arch}-${image_prefix}go-${version#go}-${DEPENDENCY_HASH}\"\n  echo \"paths<<EOF\"\n  go env GOMODCACHE\n  go env GOCACHE\n  echo \"EOF\"\n} >> \"$GITHUB_OUTPUT\"\n"
    - name: Restore docs i18n Go cache
      id: docs-i18n-go-cache
      if: matrix.requires_go == true && needs.preflight.outputs.cache_mode != 'off'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.docs-i18n-go-cache-key.outputs.paths }}
        key: ${{ steps.docs-i18n-go-cache-key.outputs.key }}
    - name: Verify docs i18n Go toolchain
      if: matrix.requires_go == true
      run: test "$(go env GOVERSION)" = "go1.27.3"
    - name: Checkout trusted Node shard runner
      if: ${{ hashFiles('scripts/ci-run-node-test-shard.mts') == '' }}
