    - name: Exact 400-prefixed function gate, then built Gateway base and head
      shell: bash
      run: "set -euo pipefail\ntrap 'code=$?; printf \"%s\\n\" \"$code\" > \"$RUNNER_TEMP/evidence/actual-exit.txt\"' EXIT\nOUT=\"$RUNNER_TEMP/evidence\"\nHARNESS=\"$RUNNER_TEMP/entrypoint-proof.py\"\ncat > \"$HARNESS\" <<'ENTRYPOINT_PY'\nimport argparse,base64,http.server,json,os,pathlib,socket,subprocess,threading,time,urllib.request,urllib.error\nCASES=[\n ('clock','At 17:34 the review found one thing for the UX pass: the screen shows two buttons.','At 17:34 the review found one thing for the UX pass: *** screen shows two buttons.'),\n ('grep','250:- Second pass: retry is fine.','250:- Second pass: *** is fine.'),\n ('credential','user=bot pass: opaque-pass-secret-1234567890','user=bot pass: opaque\u20267890'),\n ('clock-credential','17:34 pass: opaque-pass-secret-1234567890','17:34 pass: opaque\u20267890')]\ndef validate_message(side,label,msg):\n assert isinstance(msg,str) and msg, (side,label,'empty message')\n _,raw,masked=next(row for row in CASES if row[0]==label)\n if label in ('credential','clock-credential'):\n  assert 'opaque-pass-secret-1234567890' not in msg,(side,label,'credential exposed',msg)\n  assert msg!='400 '+raw,(side,label,'credential not masked',msg)\n elif label=='clock' and side=='head':\n  assert msg=='400 '+raw,(side,label,'clock prose changed',msg)\n else:\n  assert msg!='400 '+raw and masked in msg,(side,label,'prose word not masked',msg)\ndef validate(base,head):\n assert len(base)==len(head)==4\n for (label,raw,masked),b,h in zip(CASES,base,head):\n  assert b['status']==h['status'] and b['status']>=400,(label,b,h)\n  bo=json.loads(b['body']);ho=json.loads(h['body'])\n  bm=bo['error']['message'];hm=ho['error']['message']\n  validate_message('base',label,bm);validate_message('head',label,hm)\n  if label=='clock':\n   assert h['body']==b['body'].replace(masked,raw),(label,'other response difference',b,h)\n  else:\n   assert bm==hm and bo==ho,(label,'base/head response difference',b,h)\n return {'base_masks_clock_prose':True,'head_preserves_clock_prose':True,'both_mask_both_controls':True,'grep_masked_identically':True,'no_other_output_difference':True}\ndef port():\n with socket.socket() as s:s.bind(('127.0.0.1',0));return s.getsockname()[1]\ndef fetch(url,data=None,headers=None):\n try:\n  with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=headers or {}),timeout=100) as r:return r.status,r.read()\n except urllib.error.HTTPError as e:return e.code,e.read()\ndef run(side,root,out):\n out.mkdir(parents=True,exist_ok=True);provider_calls=[];active={'index':0}\n class Handler(http.server.BaseHTTPRequestHandler):\n  def do_POST(self):\n   raw=self.rfile.read(int(self.headers.get('Content-Length','0')));provider_calls.append({'path':self.path,'body':raw.decode(),'case':active['index']})\n   msg=CASES[active['index']][1];body=json.dumps({'error':{'message':msg,'type':'invalid_request_error','code':'invalid_request'}}).encode()\n   self.send_response(400);self.send_header('Content-Type','application/json');self.send_header('Content-Length',str(len(body)));self.end_headers();self.wfile.write(body)\n  def log_message(self,*args):pass\n server=http.server.ThreadingHTTPServer(('127.0.0.1',0),Handler);threading.Thread(target=server.serve_forever,daemon=True).start();gp=port()\n state=out/'state';home=out/'home';workspace=out/'workspace'\n for p in [state,home,workspace]:p.mkdir(exist_ok=True)\n config={'browser':{'enabled':False},'update':{'checkOnStart':False},'discovery':{'mdns':{'mode':'off'}},'gateway':{'mode':'local','bind':'loopback','port':gp,'auth':{'mode':'token','token':'synthetic-loopback-only-token'},'controlUi':{'enabled':False},'tailscale':{'mode':'off'},'http':{'endpoints':{'chatCompletions':{'enabled':True}}}},'cron':{'enabled':False},'plugins':{'slots':{'memory':'none'}},'tools':{'profile':'minimal'},'agents':{'defaults':{'workspace':str(workspace),'model':{'primary':'fixture/model'},'models':{'fixture/model':{'agentRuntime':{'id':'openclaw'}}},'skipBootstrap':True,'skills':[]}},'models':{'mode':'replace','providers':{'fixture':{'baseUrl':f'http://127.0.0.1:{server.server_port}/v1','apiKey':'synthetic-no-secret','api':'openai-completions','request':{'allowPrivateNetwork':True},'models':[{'id':'model','name':'Synthetic error fixture','api':'openai-completions','reasoning':False,'input':['text'],'cost':{'input':0,'output':0,'cacheRead':0,'cacheWrite':0},'contextWindow':32768,'maxTokens':2048}]}}}}\n cp=out/'config.json';cp.write_text(json.dumps(config))\n env={k:v for k,v in os.environ.items() if not any(x in k for x in ['API_KEY','AUTH_TOKEN','GITHUB_TOKEN','OPENAI','ANTHROPIC'])}\n env.update(HOME=str(home),OPENCLAW_STATE_DIR=str(state),OPENCLAW_CONFIG_PATH=str(cp),OPENCLAW_SKIP_CHANNELS='1',OPENCLAW_SKIP_CRON='1',OPENCLAW_SKIP_BROWSER_CONTROL_SERVER='1',OPENCLAW_SKIP_CANVAS_HOST='1',OPENCLAW_SKIP_GMAIL_WATCHER='1')\n cmd=['node',str(root/'openclaw.mjs'),'gateway','run','--bind','loopback','--port',str(gp),'--allow-unconfigured']\n (out/'command.json').write_text(json.dumps(cmd));logs=(out/'gateway.log').open('wb');p=subprocess.Popen(cmd,cwd=root,env=env,stdout=logs,stderr=subprocess.STDOUT,start_new_session=True)\n responses=[]\n try:\n  deadline=time.monotonic()+180\n  while True:\n   if p.poll() is not None:raise RuntimeError(f'{side} Gateway exited {p.returncode}; see gateway.log')\n   try:\n    status,_=fetch(f'http://127.0.0.1:{gp}/healthz')\n    if status==200:break\n   except (OSError,urllib.error.URLError):pass\n   if time.monotonic()>deadline:raise TimeoutError('Gateway startup')\n   time.sleep(.5)\n  for i,(label,text,_) in enumerate(CASES):\n   active['index']=i;before=len(provider_calls)\n   request={'model':'openclaw','stream':False,'messages':[{'role':'user','content':f'Produce the synthetic error for fixture {i}.'}]}\n   status,body=fetch(f'http://127.0.0.1:{gp}/v1/chat/completions',json.dumps(request).encode(),{'Content-Type':'application/json','Authorization':'Bearer synthetic-loopback-only-token','x-openclaw-session-key':f'agent:main:entrypoint-proof-{i}'})\n   (out/(label+'.body')).write_bytes(body)\n   record={'label':label,'input':text,'status':status,'body':body.decode(),'bodyBase64':base64.b64encode(body).decode(),'providerCalls':len(provider_calls)-before}\n   responses.append(record);(out/'responses.json').write_text(json.dumps(responses,indent=2));assert record['providerCalls']>0,('No fixture call',record)\n   # Fail immediately if base does not reproduce; never substitute another entry point.\n   msg=json.loads(body)['error']['message']\n   validate_message(side,label,msg)\n finally:\n  import signal\n  os.killpg(p.pid,signal.SIGTERM) if p.poll() is None else None\n  try:p.wait(timeout=15)\n  except subprocess.TimeoutExpired:os.killpg(p.pid,signal.SIGKILL);p.wait()\n  logs.close();server.shutdown();(out/'provider-calls.json').write_text(json.dumps(provider_calls,indent=2))\n (out/'exit.json').write_text(json.dumps({'gatewayExit':p.returncode,'sha':subprocess.check_output(['git','rev-parse','HEAD'],cwd=root).decode().strip()}))\n return responses\nif __name__=='__main__':\n ap=argparse.ArgumentParser();ap.add_argument('--dry-run',action='store_true');ap.add_argument('--side');ap.add_argument('--root');ap.add_argument('--out');ap.add_argument('--compare',action='store_true');args=ap.parse_args()\n if args.dry_run:\n  b=[];h=[]\n  for i,(label,raw,masked) in enumerate(CASES):\n   for rows,msg in [(b,masked),(h,raw if i==0 else masked)]:rows.append({'status':400,'body':json.dumps({'error':{'message':'400 '+msg,'type':'invalid_request_error','code':'invalid_request'}})})\n  print(json.dumps({'dryRun':validate(b,h),'rawInputs':CASES,'note':'raw-string and response-validator dry-run only; not shipped entry-point evidence'},indent=2))\n elif args.compare:\n  out=pathlib.Path(args.out);result=validate(json.loads((out/'base/responses.json').read_text()),json.loads((out/'head/responses.json').read_text()));(out/'verdict.json').write_text(json.dumps(result,indent=2));print(json.dumps(result))\n else:run(args.side,pathlib.Path(args.root).resolve(),pathlib.Path(args.out).resolve())\n\nENTRYPOINT_PY\npython3 \"$HARNESS\" --dry-run > \"$OUT/raw-string-dry-run.json\"\ngit fetch --no-tags origin 50c3a94096adece302f028b0870457932feafdca\ntest \"$(git rev-parse HEAD)\" = \"66d67d0f0c8c37313e62958ed19485e833de7a2d\"\nprintf 'BASE_SHA=%s\nHEAD_SHA=%s\nWORKFLOW_SHA=%s\n' \"66d67d0f0c8c37313e62958ed19485e833de7a2d\" \"50c3a94096adece302f028b0870457932feafdca\" \"$GITHUB_SHA\" > \"$OUT/pins.txt\"\nsha256sum \"$HARNESS\" src/logging/redact-patterns.ts src/logging/redact-patterns.test.ts > \"$OUT/base-source.sha256\"\ncat > \"$RUNNER_TEMP/gate.mts\" <<'GATE_MTS'\nimport { pathToFileURL } from 'node:url';\nimport fs from 'node:fs';\nimport assert from 'node:assert/strict';\nconst {redactSensitiveText}=await import(pathToFileURL(process.cwd()+'/src/logging/redact.ts').href);\nconst cases=JSON.parse(fs.readFileSync(process.env.CASES_FILE,'utf8'));\nconst side=process.env.SIDE;\nconst rows=[];\nfor (let i=0;i<cases.length;i++) {\n const [label,raw,masked]=cases[i];\n const input='400 '+raw;\n const output=await redactSensitiveText(input,{mode:'tools'});\n assert.equal(typeof output,'string'); assert.ok(output.length);\n const expected='400 '+(side==='base'||i>=1?masked:raw);\n rows.push({label,input,output,expected,outputBase64:Buffer.from(output).toString('base64'),pass:output===expected});\n}\nconst input='400 pass: opaque-pass-secret-1234567890';\nconst output=await redactSensitiveText(input,{mode:'tools'});\nconst result={side,sha:process.env.EXPECTED_SHA,rows,observation:{input,output,outputBase64:Buffer.from(output).toString('base64')},pass:rows.every(x=>x.pass)};\nfs.writeFileSync(process.env.GATE_OUT,JSON.stringify(result,null,2));\nconsole.log(JSON.stringify(result));\nassert.ok(result.pass,'400-prefixed function gate failed; do not build');\n\nGATE_MTS\ncat > \"$RUNNER_TEMP/cases.json\" <<'GATE_CASES'\n[[\"clock\", \"At 17:34 the review found one