 lend it to a sibling checkout.\n    token = os.environ.pop(\"CHECKOUT_TOKEN\", \"\")\n    if token and os.environ[\"CHECKOUT_REPO\"] == os.environ.get(\"GITHUB_REPOSITORY\"):\n        checkout_environment.update(git_auth_environment(remote, token))\n    del token\n    if kind == \"clawhub\":\n        workspace = os.path.join(workspace, \"clawhub-source\")\n    reset = kind in (\"linux-node\", \"android\", \"clawhub\")\n    label = \"ClawHub checkout\" if kind == \"clawhub\" else \"checkout\"\n    started_at = time.monotonic()\n    try:\n        for attempt in range(1, 6 if reset else 2):\n            try:\n                checkout()\n                if reset:\n                    print(f\"{label} attempt {attempt}/5 succeeded\", flush=True)\n                if kind == \"clawhub\":\n                    print(f\"{label} completed in {int(time.monotonic() - started_at)}s\", flush=True)\n                raise SystemExit(0)\n            except (FetchTimeout, GitFailure) as error:\n                # Only command failures are retryable. Ownership/inspection errors\n                # escape to the fail-closed boundary below, never workspace deletion.\n                check_cancelled()\n                if not reset:\n                    raise SystemExit(124 if isinstance(error, FetchTimeout) else error.code)\n                print(f\"::warning::{label} attempt {attempt}/5 failed\", flush=True)\n                backoff(attempt * 5)\n        print(f\"{label} failed after 5 attempts\", file=sys.stderr)\n        raise SystemExit(1)\n    finally:\n        checkout_environment.clear()\n\n\ndef terminal_diagnostic(error, owner_code):\n    # Code identity, not a filename supplied by policy, proves source provenance.\n    codes = {id(owner_code): owner_code}\n    pending = [owner_code]\n    while pending:\n        for value in pending.pop().co_consts:\n            if type(value) is type(owner_code):\n                codes[id(value)] = value\n                pending.append(value)\n    names = {value: value.__name__ for value in vars(builtins).values()\n             if isinstance(value, type) and issubclass(value, BaseException)}\n    names.update({FetchTimeout: \"FetchTimeout\", GitFailure: \"GitFailure\"})\n    records, seen, via = [], set(), \"terminal\"\n    while error is not None and id(error) not in seen and len(records) < 4:\n        seen.add(id(error))\n        record = {\"type\": names.get(type(error), \"unknown\"), \"via\": via}\n        for field in (\"errno\", \"winerror\"):\n            value = getattr(error, field, None)\n            if type(value) is int and -(2 ** 31) <= value < 2 ** 32:\n                record[field] = value\n        frames, trace = [], error.__traceback__\n        # Bound traversal as well as output; malformed metadata cannot stall exit.\n        for _ in range(256):\n            if trace is None:\n                break\n            if type(trace) is not TracebackType:\n                raise TypeError\n            frame, code = trace.tb_frame, trace.tb_frame.f_code\n            if frame.f_globals is globals() and id(code) in codes and 0 < trace.tb_lineno < 2 ** 31:\n                frames.append({\"function\": code.co_name[:64], \"line\": trace.tb_lineno})\n                frames = frames[-6:]\n            trace = trace.tb_next\n        record[\"owner_frames\"] = frames\n        if trace is not None:\n            record[\"traceback_truncated\"] = 1\n        records.append(record)\n        cause = error.__cause__\n        error, via = (cause, \"cause\") if cause is not None else (error.__context__, \"context\")\n    return records\n\n\nif __name__ == \"__main__\":\n    exit_code, terminal_error = 0, None\n    try:\n        main()\n    except FetchTimeout:\n        exit_code = 124\n    except GitFailure as error:\n        exit_code = error.code\n    except Exception as error:\n        exit_code, terminal_error = 125, error\n    # Leave the handler before diagnostics or exit can raise: older Python'\\''s\n    # implicit exception chaining can loop on an already-cyclic context.\n    if terminal_error is not None:\n        name, diagnostic = \"unknown\", \"unavailable\"\n        try:\n            records = terminal_diagnostic(terminal_error, sys._getframe().f_code)\n            diagnostic = json.dumps(records, separators=(\",\", \":\"))\n            name = records[0][\"type\"]\n        except BaseException:\n            pass  # Diagnostics must never replace the authoritative terminal exit.\n        try:\n            print(f\"::error::Git ownership/setup failed ({name}); refusing reuse or retry\", file=sys.stderr)\n            print(f\"[ci-git-owner] diagnostic={diagnostic}\", file=sys.stderr)\n        except BaseException:\n            pass\n    raise SystemExit(exit_code)\n'\n# End generated CI Git owner.\n"
    - name: Resolve checkout SHA
      id: checkout_ref
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Checkout trusted CI harness
      if: ${{ steps.checkout_ref.outputs.sha != github.workflow_sha }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: .ci-harness
        sparse-checkout: '/.github/actions/

          /scripts/

          /test/vitest/

          /config/ci-adaptive-markdown.json

          /config/ci-test-timings.json

          /node-runtime-env.mjs

          /node-version.mjs

          /runtime-process-scripts.generated.mjs

          /packages/normalization-core/src/stable-stringify.ts

          /src/infra/node-runtime-executable.ts

          /src/infra/runtime-process-manifest.ts

          '
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - name: Validate CI qualification dispatch
      id: qualification_dispatch
      if: github.event_name == 'workflow_dispatch' && (inputs.runner_backend != 'default' || inputs.ci_shape == 'main')
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_GATE: ${{ inputs.release_gate }}
        PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        TARGET_REF: ${{ inputs.target_ref }}
        WORKFLOW_REVISION: ${{ github.workflow_sha }}
        RELEASE_SCOPE: ${{ inputs.release_scope }}
        CI_SHAPE: ${{ inputs.ci_shape }}
        VALIDATION_TIER: ${{ inputs.validation_tier }}
        REQUESTED_RUNNER_PROFILE: ${{ inputs.runner_backend }}
        HISTORICAL_TARGET_TAG: ${{ inputs.historical_target_tag }}
        RELEASE_CANDIDATE_REF: ${{ inputs.release_candidate_ref }}
        TARGET_CONTEXT_REF: ${{ inputs.target_context_ref }}
      shell: bash
      run: "set -euo pipefail\n[[ \"$GITHUB_REPOSITORY\" == \"openclaw/openclaw\" && \"$TARGET_REF\" == \"$WORKFLOW_REVISION\" && \"$TARGET_REF\" == \"$GITHUB_SHA\" ]]\n[[ \"$TARGET_REF\" =~ ^[0-9a-f]{40}$ && \"$RELEASE_SCOPE\" == \"full\" ]]\n[[ -z \"$HISTORICAL_TARGET_TAG$RELEASE_CANDIDATE_REF$TARGET_CONTEXT_REF\" ]]\ncase \"$CI_SHAPE\" in default | main) ;; *) exit 1 ;; esac\ncase \"$REQUESTED_RUNNER_PROFILE\" in default | hybrid | runson | boat) ;; *) exit 1 ;; esac\npermission=\"$(gh api \"repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission\" --jq .permission)\"\ncase \"$permission\" in admin | maintain | write) ;; *) echo \"CI qualification requires a repository maintainer\" >&2; exit 1 ;; esac\nif [[ \"$RELEASE_GATE\" == \"true\" ]]; then\n  [[ \"$PULL_REQUEST_NUMBER\" =~ ^[1-9][0-9]*$ ]]\n  gh api \"repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER\" \\\n    --jq '{state,head:.head.sha,branch:.head.ref,repository:.head.repo.full_name,author:.user.login,base:.base.ref,baseRepository:.base.repo.full_name}' > \"$RUNNER_TEMP/qualification-pr.json\"\n  jq -e --arg sha \"$TARGET_REF\" --arg repo \"$GITHUB_REPOSITORY\" --arg branch \"$GITHUB_REF_NAME\" \\\n    '.state == \"open\" and .head == $sha and .branch == $branch and .repository == $repo and .baseRepository == $repo and .base == \"main\"' \"$RUNNER_TEMP/qualification-pr.json\"\n  source_author=\"$(jq -r .author \"$RUNNER_TEMP/qualification-pr.json\")\"\nelse\n  [[ \"$RELEASE_GATE\" == \"false\" && -z \"$PULL_REQUEST_NUMBER\" && \"$CI_SHAPE\" == \"main\" && \"$VALIDATION_TIER\" == \"main\" ]]\n  [[ \"$GITHUB_REF\" == \"refs/heads/main\" && \"$GITHUB_REF_NAME\" == \"main\" ]]\n  source_author=\"$GITHUB_ACTOR\"\nfi\necho \"source_author=$source_author\" >> \"$GITHUB_OUTPUT\"\necho \"eligible=true\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Resolve logical runner profile
      id: runner_profile
      env:
        CONFIGURED_RUNNER_PROFILE: ${{ vars.OPENCLAW_CI_RUNNER_BACKEND }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        SOURCE_AUTHOR: ${{ steps.qualification_dispatch.outputs.source_author || github.event.pull_request.user.login || github.event.head_commit.author.username || '' }}
        REQUESTED_RUNNER_PROFILE: ${{ inputs.runner_backend || 'default' }}
        QUALIFICATION_DISPATCH: ${{ steps.qualification_dispatch.outputs.eligible || 'false' }}
        CI_SHAPE: ${{ inputs.ci_shape || 'default' }}
      shell: bash
      run: "set -euo pipefail\nrunner_profile=\"${CONFIGURED_RUNNER_PROFILE:-blacksmith}\"\ncase \"$runner_profile\" in\n  github | hybrid | blacksmith | runson | boat) ;;\n  *) echo \"OPENCLAW_CI_RUNNER_BACKEND must be github, hybrid, blacksmith, runson, or boat\" >&2; exit 1 ;;\nesac\nci_qualification=false\nci_shape=default\nif [[ \"$GITHUB_EVENT_NAME\" == \"workflow_dispatch\" && \"${QUALIFICATION_DISPATCH:-false}\" == \"true\" ]]; then\n  ci_qualification=true\n  ci_shape=\"${CI_SHAPE:-default}\"\n  if [[ \"${REQUESTED_RUNNER_PROFILE:-default}\" != \"default\" ]]; then\n    runner_profile=\"$REQUESTED_RUNNER_PROFILE\"\n  fi\nelif [[ \"${REQUESTED_RUNNER_PROFILE:-default}\" != \"default\" || \"${CI_SHAPE:-default}\" != \"default\" ]]; then\n  echo \"Runner and shape overrides require an admitted CI qualification\" >&2\n  exit 1\nfi\nboat_requested=false\nif [[ \"$runner_profile\" == \"boat\" ]]; then\n  boat_requested=true\n  # Hybrid owns the logical plan; Boat is a final physical projection.\n  runner_profile=hybrid\nfi\nrunson_requested=false\nif [[ \"$runner_profile\" == \"runson\" || \"${REQUESTED_RUNNER_PROFILE:-default}\" == \"runson\" ]]; then\n  runson_requested=true\n  runner_profile=hybrid\nfi\nqualified_runner_profile=\"$runner_profile\"\nhosted_runner_profile_contract=false\ngrep -Fq \"hosted-runner-profile-contract-v1\" .github/workflows/ci.yml &&\n  hosted_runner_profile_contract=true\nfork_pull_request=false\n[[ \"$GITHUB_EVENT_NAME\" == \"pull_request\" && \"$HEAD_REPOSITORY\" != \"$GITHUB_REPOSITORY\" ]] &&\n  fork_pull_request=true\n# Forks cannot mount the trusted sticky disks and caches that size the\n# all-in-one lint/type jobs, so their check jobs keep the hosted stripes.\nif [[\n  \"$hosted_runner_profile_contract\" == \"true\" &&\n  (\n    \"$GITHUB_EVENT_NAME\" == \"workflow_dispatch\" ||\n    \"$GITHUB_REPOSITORY\" != \"openclaw/openclaw\" ||\n    \"$fork_pull_request\" == \"true\"\n  )\n]]; then\n  runner_profile=github\nfi\nnode_runner_backend=\"$runner_profile\"\nqualification_runner_backend=\nif [[ \"$ci_qualification\" == \"true\" && \"${GITHUB_RUN_ATTEMPT:-1}\" == \"1\" ]]; then\n  runner_profile=\"$qualified_runner_profile\"\n  node_runner_backend=\"$qualified_runner_profile\"\n  qualification_runner_backend=\"$qualified_runner_profile\"\nfi\n# Ordinary pushes retain hybrid; only admitted qualification may opt in on a main shape.\nif [[ \"$runson_requested\" == \"true\" && \"$GITHUB_REPOSITORY\" == \"openclaw/openclaw\" && \"${GITHUB_RUN_ATTEMPT:-1}\" == \"1\" ]] &&\n  grep -Fq \"runson-runner-profile-contract-v1\" .github/workflows/ci.yml &&\n  [[ ( \"$GITHUB_EVENT_NAME\" == \"pull_request\" && \"$HEAD_REPOSITORY\" == \"$GITHUB_REPOSITORY\" ) || \"$ci_qualification\" == \"true\" ]]; then\n  runner_profile=hybrid\n  node_runner_backend=runson\nfi\neffective_runner_backend=\"${CONFIGURED_RUNNER_PROFILE:-blacksmith}\"\nif [[ \"$ci_qualification\" == \"true\" ]]; then\n  effective_runner_backend=github\n  [[ \"${GITHUB_RUN_ATTEMPT:-1}\" != \"1\" ]] || effective_runner_backend=\"$qualification_runner_backend\"\nfi\nif [[ \"$boat_requested\" == \"true\" ]]; then\n  author=\"${SOURCE_AUTHOR:-}\"\n  boat_users=\" davemorin jalehman joshavant steipete vincentkoc \"\n  if [[ \"$GITHUB_REPOSITORY\" == \"openclaw/openclaw\" && \"$fork_pull_request\" == \"false\" && \"${GITHUB_RUN_ATTEMPT:-1}\" == \"1\" && \"$boat_users\" == *\" $author \"* && \"$boat_users\" == *\" ${GITHUB_TRIGGERING_ACTOR:-$GITHUB_ACTOR} \"* ]]; then\n    runner_profile=hybrid\n    node_runner_backend=boat\n    effective_runner_backend=boat\n  else\n    runner_profile=github\n    node_runner_backend=github\n    effective_runner_backend=github\n  fi\nfi\n# Forks cannot rely on repository variables or trusted provider credentials.\nif [[ \"$fork_pull_request\" == \"true\" && \"$GITHUB_REPOSITORY\" == \"openclaw/openclaw\" ]]; then\n  runner_profile=github\n  node_runner_backend=github\n  effective_runner_backend=github\nfi\nplacement_runner_backend=\"$effective_runner_backend\"\n[[ \"$placement_runner_backend\" != \"boat\" ]] || placement_runner_backend=hybrid\nif [[ \"$boat_requested\" == \"true\" && \"$ci_qualification\" == \"true\" ]]; then\n  qualification_runner_backend=\"$placement_runner_backend\"\nfi\nprintf '%s\\n' \\\n  \"hosted_runner_profile_contract=$hosted_runner_profile_contract\" \\\n  \"ci_qualification=$ci_qualification\" \\\n  \"ci_shape=$ci_shape\" \\\n  \"qualification_runner_backend=$qualification_runner_backend\" \\\n  \"effective_runner_backend=$effective_runner_backend\" \\\n  \"placement_runner_backend=$placement_runner_backend\" \\\n  \"runner_profile=$runner_profile\" \\\n  \"node_runner_backend=$node_runner_backend\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Resolve exact diff base
      id: diff_base
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        DISPATCH_ID: ${{ inputs.dispatch_id }}
        TARGET_CONTEXT_REF: ${{ inputs.target_context_ref }}
        WORKFLOW_REVISION: ${{ github.workflow_sha }}
        EVENT_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha || '' }}
        GH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && !inputs.release_gate && github.token || '' }}
        PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        RELEASE_GATE: ${{ inputs.release_gate }}
      run: "set -euo pipefail\nbase_sha=\"$EVENT_BASE_SHA\"\nhead_sha=\"$(git rev-parse HEAD)\"\n# Full scheduled validation has no change range. Pin the checkout itself\n# for consumers that require a protocol/lockfile comparison ref.\nif [ \"$GITHUB_EVENT_NAME\" = \"schedule\" ]; then\n  base_sha=\"$head_sha\"\nfi\nif [ \"$GITHUB_EVENT_NAME\" = \"push\" ] && [[ \"$base_sha\" =~ ^0+$ ]]; then\n  echo \"::error title=ambiguous main push::github.event.before is zero; refusing to infer a diff base for a created or recreated main branch.\" >&2\n  exit 1\nfi\nif [ \"$GITHUB_EVENT_NAME\" = \"pull_request\" ]; then\n  # A long-lived PR event can retain an old base SHA. The tested merge\n  # commit's first parent is the exact target tree for this run.\n  base_sha=\"$(node scripts/lib/merge-head-diff-base.mjs \\\n    --base \"$base_sha\" --head HEAD --prefer-first-parent)\"\nfi\nif [ \"$GITHUB_EVENT_NAME\" = \"workflow_dispatch\" ] && [ \"$RELEASE_GATE\" != \"true\" ]; then\n  # Qualification compares frozen inputs, not main after it advances.\n  # Cross-revision diagnostics retain the immutable workflow/target merge base.\n  if [[ \"${DISPATCH_ID:-}\" == full-release-validation-* && -n \"${TARGET_CONTEXT_REF:-}\" ]]; then\n    default_sha=\"$WORKFLOW_REVISION\"\n  else\n    encoded_ref=\"$(jq -rn --arg value \"refs/heads/${DEFAULT_BRANCH}\" '$value | @uri')\"\n    default_sha=\"$(gh api \"repos/${GITHUB_REPOSITORY}/commits/${encoded_ref}\" --jq .sha)\"\n  fi\n  if [[ ! \"$default_sha\" =~ ^[0-9a-f]{40}$ ]]; then\n    echo \"Could not resolve the default branch head for the manual target.\" >&2\n    exit 1\n  fi\n  echo \"default_sha=$default_sha\" >> \"$GITHUB_OUTPUT\"\n  if [[ \"$default_sha\" == \"$head_sha\" ]]; then\n    base_sha=\"$head_sha\"\n  else\n    base_sha=\"$(\n      gh api --method GET \\\n        \"repos/${GITHUB_REPOSITORY}/compare/${default_sha}...${head_sha}\" \\\n        --jq '.merge_base_commit.sha'\n    )\"\n  fi\nfi\nif [ \"$GITHUB_EVENT_NAME\" = \"workflow_dispatch\" ] && [ \"$RELEASE_GATE\" = \"true\" ]; then\n  merge_ref=\"refs/remotes/origin/release-gate-merge\"\n  python3 -I -S \"$RUNNER_TEMP/ci-git-owner.py\" --checkout-git 120 fetch \\\n    --no-tags --no-recurse-submodules --depth=2 origin \\\n    \"+refs/pull/${PULL_REQUEST_NUMBER}/merge:${merge_ref}\"\n  release_gate_head=\"$(git rev-parse \"${merge_ref}^2\")\"\n  target_head=\"$(git rev-parse HEAD)\"\n  if [ \"$release_gate_head\" != \"$target_head\" ]; then\n    echo \"release_gate pull request head ${release_gate_head} does not match target ${target_head}\" >&2\n    exit 1\n  fi\n  base_sha=\"$(git rev-parse \"${merge_ref}^1\")\"\n  head_sha=\"$(git rev-parse \"$merge_ref\")\"\nfi\nif [[ ! \"$base_sha\" =~ ^[0-9a-f]{40}$ ]]; then\n  echo \"Could not resolve an exact diff base for ${GITHUB_EVENT_NAME}.\" >&2\n  exit 1\nfi\necho \"sha=$base_sha\" >> \"$GITHUB_OUTPUT\"\necho \"head_sha=$head_sha\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Resolve checkout comparison base
      id: checkout_base
      env:
        GH_TOKEN: ${{ github.token }}
        BASE_SHA: ${{ steps.diff_base.outputs.sha }}
        DIFF_HEAD_SHA: ${{ steps.diff_base.outputs.head_sha }}
        CHECKOUT_SHA: ${{ steps.checkout_ref.outputs.sha }}
      run: "set -euo pipefail\nfor sha in \"$BASE_SHA\" \"$DIFF_HEAD_SHA\" \"$CHECKOUT_SHA\"; do\n  if [[ ! \"$sha\" =~ ^[0-9a-f]{40}$ ]]; then\n    echo \"Checkout comparison requires immutable base and head commits.\" >&2\n    exit 1\n  fi\ndone\ncomparison_base=\"$BASE_SHA\"\n# Release-gate planning uses the merge tree, but lint executes the\n# candidate. Its grandfathered source belongs to the actual fork.\nif [[ \"$CHECKOUT_SHA\" != \"$DIFF_HEAD_SHA\" ]]; then\n  comparison_base=\"$(gh api --method GET \\\n    \"repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${CHECKOUT_SHA}\" \\\n    --jq '.merge_base_commit.sha')\"\nfi\nif [[ ! \"$comparison_base\" =~ ^[0-9a-f]{40}$ ]]; then\n  echo \"Could not resolve the checkout comparison ancestor.\" >&2\n  exit 1\nfi\necho \"sha=$comparison_base\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Validate historical release target
      id: historical_target
      if: inputs.historical_target_tag != ''
      env:
        EXPECTED_SHA: ${{ steps.checkout_ref.outputs.sha }}
        GH_TOKEN: ${{ github.token }}
        HISTORICAL_TARGET_TAG: ${{ inputs.historical_target_tag }}
      run: "set -euo pipefail\nif [[ ! \"$HISTORICAL_TARGET_TAG\" =~ ^v[0-9]{4}\\.[0-9]+\\.[0-9]+((-(alpha|beta)\\.[0-9]+)|(-[1-9][0-9]*))?$ ]]; then\n  echo \"historical_target_tag must be a canonical OpenClaw release tag.\" >&2\n  exit 1\nfi\nencoded_ref=\"$(jq -rn --arg value \"refs/tags/${HISTORICAL_TARGET_TAG}\" '$value | @uri')\"\ntag_sha=\"$(gh api \"repos/${GITHUB_REPOSITORY}/commits/${encoded_ref}\" --jq .sha)\"\nif [[ \"$tag_sha\" != \"$EXPECTED_SHA\" ]]; then\n  echo \"Historical release tag ${HISTORICAL_TARGET_TAG} does not resolve to ${EXPECTED_SHA}.\" >&2\n  exit 1\nfi\necho \"eligible=true\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Validate release candidate target
      id: release_candidate_target
      if: inputs.release_candidate_ref != ''
      env:
        EXPECTED_SHA: ${{ steps.checkout_ref.outputs.sha }}
        GH_TOKEN: ${{ github.token }}
        RELEASE_CANDIDATE_REF: ${{ inputs.release_candidate_ref }}
      run: "set -euo pipefail\nif [[ ! \"$RELEASE_CANDIDATE_REF\" =~ ^(release/[0-9]{4}\\.[0-9]+\\.[0-9]+(-[1-9][0-9]*)?|extended-stable/[0-9]{4}\\.[0-9]+\\.33)$ ]]; then\n  echo \"release_candidate_ref must be a canonical OpenClaw release branch.\" >&2\n  exit 1\nfi\nencoded_ref=\"$(jq -rn --arg value \"refs/heads/${RELEASE_CANDIDATE_REF}\" '$value | @uri')\"\nbranch_sha=\"$(gh api \"repos/${GITHUB_REPOSITORY}/commits/${encoded_ref}\" --jq .sha)\"\nif [[ \"$branch_sha\" != \"$EXPECTED_SHA\" ]]; then\n  echo \"Release candidate branch ${RELEASE_CANDIDATE_REF} does not resolve to ${EXPECTED_SHA}.\" >&2\n  exit 1\nfi\necho \"eligible=true\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Validate target context
      id: target_context_target
      if: inputs.target_context_ref != ''
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_CONTEXT_REF: ${{ inputs.target_context_ref }}
        TARGET_REF: ${{ inputs.target_ref }}
      run: "set -euo pipefail\nif [[ ! \"$TARGET_CONTEXT_REF\" =~ ^(release/[0-9]{4}\\.[0-9]+\\.[0-9]+(-[1-9][0-9]*)?|extended-stable/[0-9]{4}\\.[0-9]+\\.33)$ ]]; then\n  echo \"target_context_ref must be a canonical OpenClaw release branch.\" >&2\n  exit 1\nfi\nif [[ ! \"$TARGET_REF\" =~ ^[0-9a-f]{40}$ ]]; then\n  echo \"target_context_ref requires target_ref to be a full commit SHA.\" >&2\n  exit 1\nfi\nencoded_ref=\"$(jq -rn --arg value \"refs/heads/${TARGET_CONTEXT_REF}\" '$value | @uri')\"\nbranch_sha=\"$(gh api \"repos/${GITHUB_REPOSITORY}/commits/${encoded_ref}\" --jq .sha)\"\nif [[ ! \"$branch_sha\" =~ ^[0-9a-f]{40}$ ]]; then\n  echo \"target_context_ref branch ${TARGET_CONTEXT_REF} does not exist.\" >&2\n  exit 1\nfi\ncomparison_status=\"$(\n  gh api \"repos/${GITHUB_REPOSITORY}/compare/${TARGET_REF}...${branch_sha}\" --jq .status\n)\"\nif [[ \"$comparison_status\" != \"ahead\" && \"$comparison_status\" != \"identical\" ]]; then\n  echo \"target_ref must be the declared release branch head or one of its ancestors.\" >&2\n  exit 1\nfi\necho \"eligible=true\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Setup manifest TypeScript runtime
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Resolve release correction base
      id: release_correction_base
      if: github.event_name == 'workflow_dispatch' && (inputs.release_scope == 'npm-beta' || inputs.release_scope == 'npm-stable')
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_CONTEXT_REF: ${{ steps.target_context_target.outputs.eligible == 'true' && inputs.target_context_ref || steps.historical_target.outputs.eligible == 'true' && inputs.historical_target_tag || '' }}
      run: "# Keep the token outside the manifest step, which imports candidate-owned code.\nnode --input-type=module <<'NODE'\nimport { execFileSync } from 'node:child_process';\nimport { appendFileSync, readFileSync } from 'node:fs';\nimport { resolveReleaseContextIdentity } from './.ci-harness/scripts/lib/release-context.mjs';\nconst version = JSON.parse(readFileSync('package.json', 'utf8')).version;\nconst identity = resolveReleaseContextIdentity(process.env.TARGET_CONTEXT_REF, version);\nif (identity?.baseTag) {\n  const ref = encodeURIComponent(`refs/tags/${identity.baseTag}`);\n  const sha = execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/commits/${ref}`, '--jq', '.sha'], { encoding: 'utf8' }).trim();\n  if (!/^[0-9a-f]{40}$/u.test(sha)) throw new Error(`Could not resolve correction base ${identity.baseTag}.`);\n  appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\\n`);\n}\nNODE\n"
    - name: Classify candidate cache trust
      id: candidate_trust
      env:
        CHECKOUT_REVISION: ${{ steps.checkout_ref.outputs.sha }}
        DEFAULT_SHA: ${{ steps.diff_base.outputs.default_sha }}
        HISTORICAL_TARGET: ${{ steps.historical_target.outputs.eligible || 'false' }}
        RELEASE_CANDIDATE_TARGET: ${{ steps.release_candidate_target.outputs.eligible || 'false' }}
        RELEASE_GATE: ${{ inputs.release_gate && 'true' || 'false' }}
        TARGET_CONTEXT_TARGET: ${{ steps.target_context_target.outputs.eligible || 'false' }}
        TARGET_REF: ${{ inputs.target_ref }}
        WORKFLOW_REVISION: ${{ github.workflow_sha }}
      run: "set -euo pipefail\n\ntrust=untrusted\ncache_mode=off\ncache_write_allowed=false\n\nif [[ ( \"$GITHUB_EVENT_NAME\" == \"push\" || \"$GITHUB_EVENT_NAME\" == \"schedule\" ) && \"$GITHUB_REF\" == \"refs/heads/main\" ]]; then\n  trust=main\n  cache_mode=restore\n  cache_write_allowed=true\nelif [[ \"$GITHUB_EVENT_NAME\" == \"pull_request\" ]]; then\n  trust=pull-request\n  cache_mode=restore\nelif [[ \"$GITHUB_EVENT_NAME\" == \"workflow_dispatch\" ]]; then\n  if [[ \"$RELEASE_GATE\" == \"true\" ]]; then\n    trust=pull-request\n    cache_mode=restore\n  elif [[\n    \"$HISTORICAL_TARGET\" == \"true\" ||\n    \"$RELEASE_CANDIDATE_TARGET\" == \"true\" ||\n    \"$TARGET_CONTEXT_TARGET\" == \"true\"\n  ]]; then\n    trust=release\n    cache_mode=restore\n    cache_write_allowed=true\n  elif [[ -n \"$DEFAULT_SHA\" && \"$CHECKOUT_REVISION\" == \"$DEFAULT_SHA\" ]]; then\n    trust=main\n    cache_mode=restore\n    cache_write_allowed=true\n  elif [[\n    ( -z \"$TARGET_REF\" || \"$TARGET_REF\" == \"$WORKFLOW_REVISION\" ) &&\n    \"$CHECKOUT_REVISION\" == \"$WORKFLOW_REVISION\"\n  ]]; then\n    trust=workflow\n    cache_mode=restore\n  fi\nfi\n\n{\n  echo \"trust=$trust\"\n  echo \"cache_mode=$cache_mode\"\n  echo \"cache_write_allowed=$cache_write_allowed\"\n} >> \"$GITHUB_OUTPUT\"\n"
    - name: Ensure preflight base commit
      if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
      uses: ./.ci-harness/.github/actions/ensure-base-commit
      with:
        base-sha: ${{ steps.diff_base.outputs.sha }}
        fetch-ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.base.ref }}
    - name: Detect docs-only changes
      id: docs_scope
      if: (github.event_name != 'workflow_dispatch' && github.event_name != 'schedule') || steps.runner_profile.outputs.ci_qualification == 'true'
      uses: ./.ci-harness/.github/actions/detect-docs-changes
      with:
        base-sha: ${{ steps.diff_base.outputs.sha }}
    - name: Detect changed scopes
      id: changed_scope
      if: (github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' && steps.docs_scope.outputs.docs_only != 'true') || (github.event_name == 'workflow_dispatch' && inputs.release_gate)
      shell: bash
      env:
        OPENCLAW_ALLOW_RELEASE_GENERATED_MIX: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
      run: "set -euo pipefail\n\nif [ \"${{ github.event_name }}\" = \"push\" ]; then\n  BASE=\"${{ steps.diff_base.outputs.sha }}\"\n  node scripts/ci-changed-scope.mjs --base \"$BASE\" --head HEAD\nelif [ \"${{ github.event_name }}\" = \"pull_request\" ]; then\n  BASE=\"${{ steps.diff_base.outputs.sha }}\"\n  node scripts/ci-changed-scope.mjs --base \"$BASE\" --head HEAD --merge-head-first-parent\nelse\n  BASE=\"${{ steps.diff_base.outputs.sha }}\"\n  HEAD_SHA=\"${{ steps.diff_base.outputs.head_sha }}\"\n  node scripts/ci-changed-scope.mjs --base \"$BASE\" --head \"$HEAD_SHA\"\nfi\n"
    - name: Setup manifest pnpm
      if: github.event_name == 'workflow_dispatch' && steps.checkout_ref.outputs.sha != github.workflow_sha
      uses: ./.ci-harness/.github/actions/setup-pnpm-store-cache
      with:
        cache-mode: ${{ steps.candidate_trust.outputs.cache_mode }}
        node-version: ${{ env.NODE_VERSION }}
    - name: Install manifest dependencies
      if: github.event_name == 'workflow_dispatch' && steps.checkout_ref.outputs.sha != github.workflow_sha
      run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
    - name: Check hybrid hosted assignment health
      id: hosted_health
      if: contains(fromJSON('["hybrid","runson"]'), steps.runner_profile.outputs.placement_runner_backend) && github.run_attempt == 1 && github.repository == 'openclaw/openclaw' && steps.changed_scope.outputs.run_node == 'true' && steps.changed_scope.outputs.run_node_fast_only != 'true' && (steps.qualification_dispatch.outputs.eligible == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && steps.changed_scope.outputs.run_windows == 'true'))
      env:
        GH_TOKEN: ${{ github.token }}
      run: "node --input-type=module <<'EOF'\nimport { appendFileSync } from \"node:fs\";\n// Current PRs and validated exact-head qualification share this admission owner.\nimport { inspectHybridHostedHealth } from \"./scripts/lib/ci-hybrid-hosted-health.mts\";\nconst health = await inspectHybridHostedHealth({\n  repository: process.env.GITHUB_REPOSITORY,\n  runId: process.env.GITHUB_RUN_ID,\n  token: process.env.GH_TOKEN,\n});\nappendFileSync(process.env.GITHUB_OUTPUT, `healthy=${health.healthy}\\n`);\nconst summary = `Hybrid hosted assignment: ${health.reason}; ${health.sampledJobs} sampled jobs, maximum wait ${health.maxWaitSeconds}s.`;\nconsole.log(health.healthy ? summary : `::warning::${summary} Retaining additional checks on Blacksmith.`);\nappendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\\n\\n`);\nEOF\n"
    - name: Build CI manifest
      id: manifest
      env:
        OPENCLAW_CI_DOCS_ONLY: ${{ github.event_name == 'schedule' && 'false' || github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'false' || steps.docs_scope.outputs.docs_only }}
        OPENCLAW_CI_DOCS_CHANGED: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'true' || steps.docs_scope.outputs.docs_changed }}
        OPENCLAW_CI_DOCS_ROOT_PROSE_ONLY: ${{ steps.docs_scope.outputs.root_prose_only }}
        OPENCLAW_CI_RUN_NODE: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'true' || steps.changed_scope.outputs.run_node || 'false' }}
        OPENCLAW_CI_NODE_TEST_DATA_ONLY: ${{ steps.changed_scope.outputs.node_test_data_only || 'false' }}
        OPENCLAW_CI_NODE_SELECTION: ${{ vars.OPENCLAW_CI_NODE_SELECTION }}
        OPENCLAW_CI_RUN_MACOS: ${{ (steps.qualification_dispatch.outputs.eligible == 'true' && inputs.runner_backend == 'boat' && inputs.ci_shape == 'main') && 'true' || github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && !inputs.release_gate && 'true' || steps.changed_scope.outputs.run_macos || 'false' }}
        OPENCLAW_CI_RUN_MACOS_NODE: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && !inputs.release_gate && 'true' || steps.changed_scope.outputs.run_macos_node || 'false' }}
        OPENCLAW_CI_RUN_IOS_BUILD: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && !inputs.release_gate && 'true' || steps.changed_scope.outputs.run_ios_build || 'false' }}
        OPENCLAW_CI_RUN_IOS_SCREENSHOTS: ${{ steps.changed_scope.outputs.run_ios_screenshots || 'false' }}
        OPENCLAW_CI_RUN_ANDROID_SCREENSHOTS: ${{ steps.changed_scope.outputs.run_android_screenshots || 'false' }}
        OPENCLAW_CI_RUN_ANDROID: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && ((inputs.release_gate && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true')) || inputs.include_android) && 'true' || steps.changed_scope.outputs.run_android || 'false' }}
        OPENCLAW_CI_RUN_WINDOWS: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && !inputs.release_gate && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'true' || steps.changed_scope.outputs.run_windows || 'false' }}
        OPENCLAW_CI_RUN_NODE_FAST_ONLY: ${{ github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'false' || steps.changed_scope.outputs.run_node_fast_only || 'false' }}
        OPENCLAW_CI_RUN_NODE_FAST_PLUGIN_CONTRACTS: ${{ github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'false' || steps.changed_scope.outputs.run_node_fast_plugin_contracts || 'false' }}
        OPENCLAW_CI_RUN_NODE_FAST_CI_ROUTING: ${{ github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'false' || steps.changed_scope.outputs.run_node_fast_ci_routing || 'false' }}
        OPENCLAW_CI_RUN_SKILLS_PYTHON: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'true' || steps.changed_scope.outputs.run_skills_python || 'false' }}
        OPENCLAW_CI_RUN_CONTROL_UI_I18N: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'true' || steps.changed_scope.outputs.run_control_ui_i18n || 'false' }}
        OPENCLAW_CI_RUN_UI_TESTS: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && !inputs.release_gate && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'true' || steps.changed_scope.outputs.run_ui_tests || 'false' }}
        OPENCLAW_CI_UI_E2E_FULL: ${{ vars.OPENCLAW_CI_UI_E2E_FULL || 'false' }}
        OPENCLAW_CI_IOS_SIMULATOR_FULL: ${{ vars.OPENCLAW_CI_IOS_SIMULATOR_FULL || 'false' }}
        OPENCLAW_CI_EXTENSION_LINT_FULL: ${{ vars.OPENCLAW_CI_EXTENSION_LINT_FULL || 'false' }}
        OPENCLAW_CI_RUN_NATIVE_I18N: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'true' || steps.changed_scope.outputs.run_native_i18n || 'false' }}
        OPENCLAW_CI_CHANGED_PATHS_FILE: ${{ steps.changed_scope.outputs.changed_paths_file }}
        OPENCLAW_CI_CHANGED_PATHS_JSON: ${{ steps.changed_scope.outputs.changed_paths_json || 'null' }}
        OPENCLAW_CI_CHANGED_BASE: ${{ steps.diff_base.outputs.sha }}
        OPENCLAW_CI_CHECKOUT_REVISION: ${{ steps.checkout_ref.outputs.sha }}
        OPENCLAW_CI_CORRECTION_BASE_SHA: ${{ steps.release_correction_base.outputs.sha }}
        OPENCLAW_CI_HISTORICAL_TARGET: ${{ steps.historical_target.outputs.eligible || 'false' }}
        OPENCLAW_CI_RELEASE_GATE: ${{ inputs.release_gate && 'true' || 'false' }}
        OPENCLAW_CI_RELEASE_FAST_LANE_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-fast-lane') && 'true' || 'false' }}
        OPENCLAW_CI_RELEASE_SCOPE: ${{ inputs.release_scope || 'full' }}
        OPENCLAW_CI_VALIDATION_TIER: ${{ github.event_name == 'schedule' && 'main' || inputs.validation_tier || 'full' }}
        OPENCLAW_CI_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        OPENCLAW_CI_TARGET_REF: ${{ inputs.target_ref }}
        OPENCLAW_CI_TARGET_CONTEXT_REF: ${{ inputs.target_context_ref }}
        OPENCLAW_CI_HISTORICAL_TARGET_TAG: ${{ inputs.historical_target_tag }}
        OPENCLAW_CI_RELEASE_CANDIDATE_TARGET: ${{ steps.release_candidate_target.outputs.eligible || 'false' }}
        OPENCLAW_CI_TARGET_CONTEXT_TARGET: ${{ steps.target_context_target.outputs.eligible || 'false' }}
        OPENCLAW_CI_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        OPENCLAW_CI_REPOSITORY: ${{ github.repository }}
        OPENCLAW_CI_EVENT_NAME: ${{ github.event_name }}
        OPENCLAW_CI_TEST_RUNTIME_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_runtime_policy || '' }}
        OPENCLAW_CI_RUNNER_PROFILE: ${{ steps.runner_profile.outputs.runner_profile }}
        OPENCLAW_CI_NODE_RUNNER_BACKEND: ${{ steps.runner_profile.outputs.node_runner_backend }}
        OPENCLAW_CI_QUALIFICATION: ${{ steps.runner_profile.outputs.ci_qualification }}
        OPENCLAW_CI_SHAPE: ${{ steps.runner_profile.outputs.ci_shape }}
        OPENCLAW_CI_RUNNER_BACKEND: ${{ steps.runner_profile.outputs.placement_runner_backend }}
        OPENCLAW_CI_EFFECTIVE_RUNNER_BACKEND: ${{ steps.runner_profile.outputs.effective_runner_backend }}
        OPENCLAW_CI_HOSTED_HEALTHY: ${{ steps.hosted_health.outputs.healthy }}
        OPENCLAW_CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        OPENCLAW_CI_PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        OPENCLAW_CI_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
      run: "manifest_node_args=()\nif [ \"${GITHUB_EVENT_NAME:-}\" = \"workflow_dispatch\" ] &&\n  [ \"$OPENCLAW_CI_CHECKOUT_REVISION\" != \"$OPENCLAW_CI_WORKFLOW_REVISION\" ]; then\n  manifest_node_args+=(--import tsx)\nfi\nnode \"${manifest_node_args[@]}\" .ci-harness/scripts/ci-build-manifest.mjs\n"
    - name: Restore adaptive CI priors
      if: ${{ github.repository == 'openclaw/openclaw' && steps.manifest.outputs.frozen_target == 'false' && steps.manifest.outputs.run_checks_node_core_nondist == 'true' && (github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && endsWith(github.run_id, '0'))) }}
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node .ci-harness/scripts/ci-adaptive-priors.mjs
    - name: Share adaptive CI priors
      if: ${{ steps.manifest.outputs.frozen_target == 'false' && hashFiles('.artifacts/ci-adaptive-priors.json') != '' }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ci-adaptive-priors-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/ci-adaptive-priors.json
        include-hidden-files: true
        retention-days: 7
    - name: Restore exact dependency cache
      if: steps.runner_profile.outputs.effective_runner_backend != 'boat' && steps.runner_profile.outputs.placement_runner_backend != 'github' && !contains(fromJSON('["hybrid","runson"]'), steps.runner_profile.outputs.placement_runner_backend) && github.repository == 'openclaw/openclaw' && steps.manifest.outputs.run_node == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
      uses: ./.ci-harness/.github/actions/setup-node-env
      with:
        cache-mode: ${{ steps.candidate_trust.outputs.cache_mode }}
        dependency-cache: 'true'
        install-bun: 'false'
    - name: Select two whole composed rows and expand to twelve paired samples
      id: only_requested
      env:
        CHECKOUT_SHA: ${{ steps.checkout_ref.outputs.sha }}
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/base-input-matrix.json <<'MATRIX_JSON'\n${{ steps.manifest.outputs.checks_node_core_nondist_matrix }}\nMATRIX_JSON\ncat > /tmp/base-input-pools.json <<'POOLS_JSON'\n${{ steps.manifest.outputs.node_test_group_pools_json }}\nPOOLS_JSON\nnode --import tsx --input-type=module <<'JS'\nimport {appendFileSync,writeFileSync,readFileSync} from 'node:fs';\nimport {decodeNodeTestGroups} from './.ci-harness/scripts/lib/ci-node-test-groups-codec.mts';\nconst wanted=new Map([['core-runtime-config-hosted-2',['node']],['core-runtime-infra-system-runtime-hosted-2',['node']]]);\nconst matrix=JSON.parse(readFileSync('/tmp/base-input-matrix.json','utf8'));\nconst pools=JSON.parse(readFileSync('/tmp/base-input-pools.json','utf8'));\nconst found=new Set(), selected=[];\nfor(const row of matrix.include){\n const groups=row.groups_pool?decodeNodeTestGroups(pools[row.groups_pool])[Number(row.groups_index)]:row.groups_gzip_base64?decodeNodeTestGroups(row.groups_gzip_base64):row.groups;\n if(!Array.isArray(groups)){\n  if(Array.isArray(row.targets) && row.shard_name && !wanted.has(row.shard_name)){\n    console.log('SKIP_NONREQUESTED_STANDALONE_ROW',row.check_name); continue;\n  }\n  throw new Error('Missing groups for '+row.check_name);\n }\n const matches=groups.filter(g=>wanted.get(g.shard_name)?.includes(row.test_runtime));\n if(matches.length){\n  for(const g of matches)found.add(g.shard_name+'|'+row.test_runtime);\n  selected.push(row);\n  console.log('SELECTED_WHOLE_ROW',row.check_name,row.test_runtime,JSON.stringify(groups));\n }\n}\nfor(const [name,runtimes] of wanted)for(const runtime of runtimes)if(!found.has(name+'|'+runtime))throw new Error('Missing required shard '+name+'|'+runtime);\nif(selected.length!==2)throw new Error('Expected exactly two whole composed rows, got '+selected.length);\nconst expanded=[];\nfor(let repeat=1;repeat<=3;repeat++)for(const row of selected)for(const [side,sha] of [['base','53633171bf52fddf2abe3c5549b97320febb2677'],['candidate','22cd98396afedb08c7fba1c02fe18ddf2c9a0694']]){\n const copy={...row,base_check_name:row.base_check_name||row.check_name,check_name:row.check_name+'-'+side+'-'+repeat,paired_side:side,paired_repeat:repeat,paired_checkout:sha};\n expanded.push(copy);console.log('PAIRED_ROW',JSON.stringify(copy));\n}\nif(expanded.length!==12)throw new Error('Expected 12 jobs');\nselected.splice(0,selected.length,...expanded);\nconsole.log('CHECKOUT_SHA='+process.env.CHECKOUT_SHA);\nwriteFileSync('/tmp/selected-base-matrix.json',JSON.stringify({include:selected},null,2));\nappendFileSync(process.env.GITHUB_OUTPUT,'matrix='+JSON.stringify({include:selected})+'\\n');\nJS\n"
    - name: Preserve selected matrix
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: selected-base-matrix
        path: /tmp/selected-base-matrix.json
        if-no-files-found: warn
  checks-node-core-test-nondist-shard:
    permissions:
      contents: read
    env:
      CHECKOUT_GIT_COMMITS_JSON: ${{ toJson(matrix.git_commits) }}
    name: ${{ matrix.check_name || 'checks-node-core-test-nondist-shard' }}
    needs:
