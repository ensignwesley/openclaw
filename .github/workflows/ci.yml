-side base --root \"$PWD\" --out \"$OUT/base\" 2>&1 | tee \"$OUT/base-proof.log\"\npipe_codes=(\"${PIPESTATUS[@]}\")\nset -e\nprintf '%s\\n' \"${pipe_codes[*]}\" > \"$OUT/base-proof.log.pipeline-exits.txt\"\nfor code in \"${pipe_codes[@]}\"; do if [ \"$code\" -ne 0 ]; then exit \"$code\"; fi; done\ntest -z \"$(git diff --name-only)\"\ngit checkout --detach 50c3a94096adece302f028b0870457932feafdca\ntest \"$(git rev-parse HEAD)\" = \"50c3a94096adece302f028b0870457932feafdca\"\nsha256sum src/logging/redact-patterns.ts src/logging/redact-patterns.test.ts > \"$OUT/head-source.sha256\"\nset +e\ncorepack pnpm build:runtime 2>&1 | tee \"$OUT/head-build.log\"\npipe_codes=(\"${PIPESTATUS[@]}\")\nset -e\nprintf '%s\\n' \"${pipe_codes[*]}\" > \"$OUT/head-build.log.pipeline-exits.txt\"\nfor code in \"${pipe_codes[@]}\"; do if [ \"$code\" -ne 0 ]; then exit \"$code\"; fi; done\nset +e\npython3 \"$HARNESS\" --side head --root \"$PWD\" --out \"$OUT/head\" 2>&1 | tee \"$OUT/head-proof.log\"\npipe_codes=(\"${PIPESTATUS[@]}\")\nset -e\nprintf '%s\\n' \"${pipe_codes[*]}\" > \"$OUT/head-proof.log.pipeline-exits.txt\"\nfor code in \"${pipe_codes[@]}\"; do if [ \"$code\" -ne 0 ]; then exit \"$code\"; fi; done\nset +e\npython3 \"$HARNESS\" --compare --out \"$OUT\" 2>&1 | tee \"$OUT/comparison.log\"\npipe_codes=(\"${PIPESTATUS[@]}\")\nset -e\nprintf '%s\\n' \"${pipe_codes[*]}\" > \"$OUT/comparison.log.pipeline-exits.txt\"\nfor code in \"${pipe_codes[@]}\"; do if [ \"$code\" -ne 0 ]; then exit \"$code\"; fi; done\ntest -z \"$(git diff --name-only)\"\ncp \"$HARNESS\" \"$OUT/proof.py\"\n"
    - name: Seal retained evidence
      if: always()
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PYSEAL''

        import pathlib,os,hashlib,json

        p=pathlib.Path(os.environ[''RUNNER_TEMP''])/''evidence''

        # Runtime state is disposable and may contain large databases. Keep source, bodies, logs, configs and receipts.

        seals={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob(''*'') if f.is_file() and not any(x in f.relative_to(p).parts for x in [''state'',''home'',''workspace''])}

        (p/''SHA256SUMS.json'').write_text(json.dumps(seals,indent=2))

        PYSEAL

        '
    - name: Upload raw entry-point evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: shipped-entrypoint-proof
        path: ${{ runner.temp }}/evidence/
        retention-days: 30
