name: CI
run-name: Runtime cache paired caller proof 20261127
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-callers:
    name: Serial base and candidate blind plus cache-prefix
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_SHA: 0a8e37b7d5cceb45e9b34de45c1dea5419166fc9
      CANDIDATE_SHA: efb797d3cb6ac9f4d8cd9d17a8ad698f713a0074
      EVIDENCE: ${{ runner.temp }}/runtime-cache-evidence
    steps:
      - name: Checkout frozen harness and source history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Preflight selected rows and frozen source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD > "$EVIDENCE/workflow-pin.txt"
          cp .github/runtime-cache-proof/run-pair.sh "$RUNNER_TEMP/run-runtime-cache-pair.sh"
          bash -n "$RUNNER_TEMP/run-runtime-cache-pair.sh"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git diff --binary "$BASE_SHA" "$CANDIDATE_SHA" > "$EVIDENCE/candidate.patch"
          printf '%s  %s\n' 48b63a62a9168db816063436034644fc403e610d8f68a6f687a855a162f61420 "$EVIDENCE/candidate.patch" | sha256sum --check
          python3 - <<'PY'
          import os,subprocess
          files=subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA'],os.environ['CANDIDATE_SHA']],text=True).splitlines()
          assert files==['docs/concepts/system-prompt.md','src/agents/system-prompt-runtime.test.ts','src/agents/system-prompt-runtime.ts','src/agents/system-prompt.blind.test.ts'],files
          print('Exactly two selections: blind (one file), cache-prefix (two files); each base then candidate, same runner and harness.')
          PY
          git checkout --detach "$BASE_SHA"
      - name: Setup identical Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.3
      - name: Install unchanged frozen dependencies once
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Run both selections serially on base then candidate
        shell: bash
        run: bash "$RUNNER_TEMP/run-runtime-cache-pair.sh"
      - name: Seal raw logs and actual exits
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path(os.environ['EVIDENCE'])
          (r/'artifact-seal.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in r.iterdir() if p.is_file() and p.name!='artifact-seal.json'},indent=2)+'\n')
          PY
      - name: Upload bounded proof evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-cache-paired-callers
          path: ${{ runner.temp }}/runtime-cache-evidence
          if-no-files-found: error
          retention-days: 7
