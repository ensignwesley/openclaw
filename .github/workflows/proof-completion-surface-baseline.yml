name: Restricted completion declaration baseline

on:
  push:
    branches: [proof/restricted-completion-baseline-20261113-setup-v2]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENCLAW_VITEST_RUNTIME: node
  COMPLETION_SURFACE_PROOF_OUTPUT: ${{ github.workspace }}/proof-output/row1

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Bind unchanged current-main production
        run: |
          set -euo pipefail
          mkdir -p proof-output
          test "$(git rev-parse HEAD^)" = 74fe09926ab5e4d12f6248d533338ff4c9f1f04e
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 2
          test -z "$(git diff HEAD^ HEAD -- src packages extensions scripts package.json pnpm-lock.yaml)"
          git rev-parse HEAD HEAD^ > proof-output/commits.txt
          sha256sum test/gateway-completion-surface.proof.e2e.test.ts > proof-output/fixture.sha256
          echo "0c4205dbb2bd3b28a60c21f19587456b8f9b2f52c9417be49f657e613895fa3a  test/gateway-completion-surface.proof.e2e.test.ts" | sha256sum --check
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile 2>&1 | tee proof-output/install.log
      - name: Build pristine current-main shipped runtime
        run: |
          set -euo pipefail
          corepack pnpm build:runtime 2>&1 | tee proof-output/build.log
          sha256sum openclaw.mjs dist/index.* > proof-output/entrypoint.sha256
      - name: Check diagnostic fixture and workflow
        run: |
          set -euo pipefail
          corepack pnpm exec oxfmt --check test/gateway-completion-surface.proof.e2e.test.ts 2>&1 | tee proof-output/format.log
          node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.test.root.json test/gateway-completion-surface.proof.e2e.test.ts 2>&1 | tee proof-output/lint.log
          node --import ./scripts/tsx.mjs scripts/check-workflows.mts 2>&1 | tee proof-output/workflows.log
      - name: Actual verified and missing-envelope announce provider requests
        run: |
          set -euo pipefail
          corepack pnpm test test/gateway-completion-surface.proof.e2e.test.ts --maxWorkers=1 2>&1 | tee proof-output/test.log
      - name: Preserve raw requests, responses, receipts and cleanup on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restricted-completion-baseline
          path: proof-output/
          retention-days: 14
          if-no-files-found: error
