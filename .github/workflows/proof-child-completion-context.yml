name: Child completion context baseline proof

on:
  push:
    branches: [proof/child-completion-context-20261110]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENCLAW_VITEST_RUNTIME: node
  CHILD_COMPLETION_PROOF_ARTIFACT_DIR: ${{ github.workspace }}/proof-output

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Bind the baseline source and frozen fixture
        run: |
          set -euo pipefail
          mkdir -p proof-output
          test "$(git rev-parse HEAD^)" = b382a29a688aac3a50f8c2452146386cfd6adc1d
          test -z "$(git diff HEAD^ HEAD -- src packages extensions scripts package.json pnpm-lock.yaml)"
          git rev-parse HEAD HEAD^ > proof-output/commits.txt
          sha256sum test/gateway-child-completion-context.proof.e2e.test.ts > proof-output/fixture.sha256
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile 2>&1 | tee proof-output/install.log
      - name: Fresh runtime build for the actual shipped Gateway
        run: |
          set -euo pipefail
          corepack pnpm build:runtime 2>&1 | tee proof-output/build.log
          sha256sum openclaw.mjs dist/index.* > proof-output/entrypoint.sha256
      - name: Scoped lint and workflow validation
        run: |
          set -euo pipefail
          node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.test.root.json test/gateway-child-completion-context.proof.e2e.test.ts 2>&1 | tee proof-output/lint.log
          node --import ./scripts/tsx.mjs scripts/check-workflows.mts 2>&1 | tee proof-output/workflows.log
      - name: Real spawn and completion provider-request invariant
        run: |
          set -euo pipefail
          corepack pnpm test test/gateway-child-completion-context.proof.e2e.test.ts --maxWorkers=1 2>&1 | tee proof-output/test.log
      - name: Preserve terminal evidence, including a failed baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: child-completion-context-baseline
          path: proof-output/
          retention-days: 14
          if-no-files-found: error
