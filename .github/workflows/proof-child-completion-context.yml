name: Child completion context candidate proof

on:
  push:
    branches: [proof/child-completion-candidate-20261111]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENCLAW_VITEST_RUNTIME: node
  CHILD_COMPLETION_PROOF_ARTIFACT_DIR: ${{ github.workspace }}/proof-output

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Bind the candidate source and frozen fixture
        run: |
          set -euo pipefail
          mkdir -p proof-output
          test "$(git rev-parse HEAD^)" = faab154c1e878d9e441f6ebbc2180217fb0478a8
          test -z "$(git diff HEAD^ HEAD -- src packages extensions scripts package.json pnpm-lock.yaml)"
          git rev-parse HEAD HEAD^ > proof-output/commits.txt
          sha256sum test/gateway-child-completion-context.proof.e2e.test.ts > proof-output/fixture.sha256
          echo "959471467b925896a20ea49fe84917685cd5720ff62ead415ffbdcab91f19953  test/gateway-child-completion-context.proof.e2e.test.ts" | sha256sum --check
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile 2>&1 | tee proof-output/install.log
      - name: Fresh runtime build for the actual shipped Gateway
        run: |
          set -euo pipefail
          corepack pnpm build:runtime 2>&1 | tee proof-output/build.log
          sha256sum openclaw.mjs dist/index.* > proof-output/entrypoint.sha256
      - name: Scoped lint and workflow validation
        run: |
          set -euo pipefail
          node scripts/run-tsgo.mjs -p tsconfig.core.json 2>&1 | tee proof-output/types.log
          node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.test.root.json test/gateway-child-completion-context.proof.e2e.test.ts src/agents/embedded-agent-runner/run/attempt-prompt-build.ts src/agents/runtime-facts-prompt.ts src/agents/subagents/registry/subagent-active-context.ts src/agents/subagents/registry/subagent-active-context.test.ts 2>&1 | tee proof-output/lint.log
          node --import ./scripts/tsx.mjs scripts/check-workflows.mts 2>&1 | tee proof-output/workflows.log
      - name: Focused owner, runtime-facts and prefix stability
        run: |
          set -euo pipefail
          corepack pnpm test src/agents/subagents/registry/subagent-active-context.test.ts src/agents/runtime-facts-prompt.test.ts src/agents/embedded-agent-runner/run/attempt.subagent-runtime-facts.test.ts src/agents/system-prompt.cache-prefix.test.ts src/agents/agent-tools.prefix-stability.test.ts --maxWorkers=1 2>&1 | tee proof-output/focused.log
      - name: Real spawn and completion provider-request invariant
        run: |
          set -euo pipefail
          corepack pnpm test test/gateway-child-completion-context.proof.e2e.test.ts --maxWorkers=1 2>&1 | tee proof-output/test.log
      - name: Preserve terminal evidence, including a failed candidate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: child-completion-context-candidate
          path: proof-output/
          retention-days: 14
          if-no-files-found: error
