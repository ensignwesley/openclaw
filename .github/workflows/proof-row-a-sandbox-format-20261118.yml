name: Row A product formatting artifact
on:
  push:
    branches: [proof/row-a-sandbox-format-20261118]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ce9bf9bdf538f83d58a8d3e285e3c05726638e2d
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          cache-mode: "off"
      - name: Format only the candidate files; preserve an inspectable patch
        run: |
          mkdir -p "$RUNNER_TEMP/row-a-sandbox-format"
          git rev-parse HEAD > "$RUNNER_TEMP/row-a-sandbox-format/product-head.txt"
          git fetch --no-tags --depth=1 origin 53633171bf52fddf2abe3c5549b97320febb2677
          mapfile -t files < <(git diff --name-only 53633171bf52fddf2abe3c5549b97320febb2677 HEAD -- '*.ts')
          corepack pnpm exec oxfmt --write "${files[@]}"
          git diff --binary -- "${files[@]}" > "$RUNNER_TEMP/row-a-sandbox-format/format.patch"
          corepack pnpm exec oxfmt --check "${files[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: row-a-sandbox-format-ce9bf9bdf538f83d58a8d3e285e3c05726638e2d
          path: ${{ runner.temp }}/row-a-sandbox-format
          if-no-files-found: error
          retention-days: 30
