name: Queued Telegram history baseline

on:
  push:
    branches: [proof/queued-telegram-history-baseline-20261113-provider-v3]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENCLAW_VITEST_RUNTIME: node

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Bind unchanged current-main production and external diagnostic
        run: |
          set -euo pipefail
          mkdir -p proof-output
          test "$(git rev-parse HEAD^)" = 74fe09926ab5e4d12f6248d533338ff4c9f1f04e
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 2
          test -z "$(git diff HEAD^ HEAD -- src packages extensions scripts package.json pnpm-lock.yaml)"
          git rev-parse HEAD HEAD^ > proof-output/commits.txt
          sha256sum test/gateway-queued-telegram-prefix.proof.mts > proof-output/fixture.sha256
          echo "7a0f73515356d3d17dfa45fe3e4e9bf5182778ea21ff2aed12656a2e905d3fa8  test/gateway-queued-telegram-prefix.proof.mts" | sha256sum --check
          cp test/gateway-queued-telegram-prefix.proof.mts "$RUNNER_TEMP/queued-telegram-prefix.mts"
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile 2>&1 | tee proof-output/install.log
      - name: Build unchanged shipped private-QA Gateway
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
        run: |
          set -euo pipefail
          corepack pnpm build 2>&1 | tee proof-output/build.log
          sha256sum openclaw.mjs dist/index.* > proof-output/entrypoint.sha256
      - name: Validate workflow
        run: |
          set -euo pipefail
          node --import ./scripts/tsx.mjs scripts/check-workflows.mts 2>&1 | tee proof-output/workflows.log
      - name: Real Telegram spool and default sessions_send ordering
        run: |
          set -euo pipefail
          ROW2_REPO="$PWD" ROW2_EXPECT_SHA="$GITHUB_SHA" ROW2_EVIDENCE="$PWD/proof-output/row2" node --import ./scripts/tsx.mjs "$RUNNER_TEMP/queued-telegram-prefix.mts" 2>&1 | tee proof-output/runtime.log
      - name: Preserve raw requests, ingress receipts, ordering and cleanup
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: queued-telegram-history-baseline
          path: proof-output/
          retention-days: 14
          if-no-files-found: error
