name: Remote skills dependent candidate proof
on:
  push:
    branches: [fix/remote-skills-current-turn]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [bare-base, red, green]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select exact owner base while retaining the same proof harness
        env:
          MODE: ${{ matrix.mode }}
        run: |
          cp src/skills/runtime/remote-prefix-proof.integration.test.ts "$RUNNER_TEMP/proof.test.ts"
          if [ "$MODE" != green ]; then
            git fetch --no-tags --depth=1 origin 53633171bf52fddf2abe3c5549b97320febb2677
            git checkout --detach 53633171bf52fddf2abe3c5549b97320febb2677
            cp "$RUNNER_TEMP/proof.test.ts" src/skills/runtime/remote-prefix-proof.integration.test.ts
          fi
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          cache-mode: "off"
      - name: Scoped gates or exact wire regression
        env:
          OPENCLAW_VITEST_RUNTIME: node
          ROW_A_RECEIPTS_DIR: ${{ runner.temp }}/row-a-candidate
          MODE: ${{ matrix.mode }}
        run: |
          mkdir -p "$ROW_A_RECEIPTS_DIR"
          git rev-parse HEAD > "$ROW_A_RECEIPTS_DIR/owner-head.txt"
          sha256sum src/skills/runtime/remote-prefix-proof.integration.test.ts > "$ROW_A_RECEIPTS_DIR/harness.sha256"
          if [ "$MODE" = bare-base ]; then
            node scripts/run-vitest.mjs src/skills/loading/workspace-skill-prompt.test.ts src/skills/loading/workspace-skill-prompt-resolution.test.ts src/agents/embedded-agent-runner/run/attempt-prompt-context.test.ts src/agents/agent-tools.prefix-stability.test.ts --maxWorkers=1
          else
            node scripts/run-vitest.mjs src/skills/runtime/remote-prefix-proof.integration.test.ts --maxWorkers=1
            if [ "$MODE" = green ]; then
              node scripts/run-vitest.mjs src/skills/loading/workspace-skill-prompt.test.ts src/skills/loading/workspace-skill-prompt-resolution.test.ts src/agents/embedded-agent-runner/run/attempt-prompt-context.test.ts src/agents/agent-tools.prefix-stability.test.ts --maxWorkers=1
            fi
          fi
      - name: Preserve proof receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: remote-skills-candidate-${{ matrix.mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/row-a-candidate
          if-no-files-found: error
          retention-days: 30
