name: Row A sandbox catalog RED only
on:
  push:
    branches: [proof/row-a-version-recovery-red-r2-20261119]
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select exact product-only owners with unchanged capture harness
        run: |
          cp src/skills/runtime/separated-recovery.integration.test.ts "$RUNNER_TEMP/legacy.test.ts"
          git fetch --no-tags --depth=1 origin 345c84aeb2f4035898cb8e123dce3d6fb88af167
          git checkout --detach 345c84aeb2f4035898cb8e123dce3d6fb88af167
          cp "$RUNNER_TEMP/legacy.test.ts" src/skills/runtime/separated-recovery.integration.test.ts
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          cache-mode: "off"
      - name: Materialized sandbox model-request regression
        env:
          OPENCLAW_VITEST_RUNTIME: node
          ROW_A_RECEIPTS_DIR: ${{ runner.temp }}/row-a-version-recovery-red
        run: |
          mkdir -p "$ROW_A_RECEIPTS_DIR"
          git rev-parse HEAD > "$ROW_A_RECEIPTS_DIR/owner-head.txt"
          sha256sum src/skills/runtime/separated-recovery.integration.test.ts > "$ROW_A_RECEIPTS_DIR/harness.sha256"
          node scripts/run-vitest.mjs src/skills/runtime/separated-recovery.integration.test.ts --maxWorkers=1 2>&1 | tee "$ROW_A_RECEIPTS_DIR/test.log"
      - name: Preserve receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: row-a-version-recovery-red-${{ github.sha }}
          path: ${{ runner.temp }}/row-a-version-recovery-red
          if-no-files-found: error
          retention-days: 30
