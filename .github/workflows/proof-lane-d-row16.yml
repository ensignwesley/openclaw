name: Lane D row16 human image replay proof
on:
  push:
    branches: ["proof/lane-d-row16-candidate-20261104"]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record exact proof and full product source identity
        id: identity
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/row16-proof"
          mkdir -p "$evidence"
          base=753f48d41b0c705661e7c6fdfafc2d547f58c006
          product=93a77eb0c0f255447827a150212feb82375ce7a6
          git rev-parse HEAD > "$evidence/head.txt"
          git show -s --format=fuller HEAD > "$evidence/commit.txt"
          printf '%s\n' "$base" > "$evidence/product-base.txt"
          printf '%s\n' "$product" > "$evidence/product-head.txt"
          git ls-tree -r HEAD > "$evidence/full-tree-manifest.txt"
          git ls-tree -r "$product" > "$evidence/product-tree-manifest.txt"
          git diff --name-status "$base" HEAD > "$evidence/changed-from-product-base.txt"
          git diff --name-only -z "$base" HEAD | xargs -0 sha256sum > "$evidence/candidate-sha256.txt"
          git diff --name-only -z "$base" "$product" | xargs -0 sha256sum > "$evidence/product-source-sha256.txt"
          sha256sum test/lane-d-row16-image-replay.e2e.test.ts .github/workflows/proof-lane-d-row16.yml > "$evidence/proof-sha256.txt"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$product"
          git merge-base --is-ancestor "$base" "$product"
          printf '%s  %s\n' 6446abf7546e3ef5d7dee51bdfef016c94cfd73c4c30d9fcae63b1d251d8b61b test/lane-d-row16-image-replay.e2e.test.ts | sha256sum --check
          git diff --name-only "$product" HEAD > "$evidence/proof-only-paths.txt"
          printf '%s\n' .github/workflows/proof-lane-d-row16.yml test/lane-d-row16-image-replay.e2e.test.ts > "$evidence/expected-proof-only-paths.txt"
          diff -u "$evidence/expected-proof-only-paths.txt" "$evidence/proof-only-paths.txt"
      - name: Standard pinned Node and dependencies
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          node-version: "24.22.1"
          install-bun: "true"
      - name: Prepare canonical stamped runtime and AI package
        run: node scripts/prepare-vitest-runtime.mjs --with-ai-package
      - name: Focused producer and replay regressions
        env:
          OPENCLAW_VITEST_RUNTIME: node
        run: >-
          pnpm test
          src/sessions/user-turn-transcript.test.ts
          src/config/sessions/session-actor-message-rewrite.test.ts
          src/config/sessions/session-actor-memory-reports.test.ts
          src/agents/embedded-agent-runner/run/attempt-prompt-submit.projections.test.ts
          src/gateway/chat-display-projection.private-prompts.test.ts
          src/agents/embedded-agent-runner/run/images.replay.test.ts
          src/agents/agent-tools.prefix-stability.test.ts
          src/agents/sessions/sdk.test.ts
          src/agents/sessions/extensions/runner.test.ts
          src/agents/embedded-agent-runner/run/images.test.ts
          src/agents/embedded-agent-runner/run/attempt.llm-boundary.test.ts
          src/agents/embedded-agent-runner/run/attempt.llm-boundary.cache-stability.test.ts
          src/system-agent/user-turn-transcript.test.ts
          src/plugins/hooks.phase-hooks.test.ts
          --maxWorkers=1
      - name: Production typecheck
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: pnpm tsgo:core
      - name: Changed-test typecheck
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const files = execFileSync('git', ['diff', '--name-only', '753f48d41b0c705661e7c6fdfafc2d547f58c006', 'HEAD'], {encoding:'utf8'}).trim().split('\n').filter(p => p.endsWith('.test.ts'));
          fs.writeFileSync('test/tsconfig/tsconfig.row16-proof.json', JSON.stringify({extends:'./tsconfig.core.test.shard.json',include:files.map(p=>'../../'+p),exclude:[]}));
          JS
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.row16-proof.json
      - name: Targeted lint and exact formatting
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: |
          mapfile -t touched < <(git diff --name-only 753f48d41b0c705661e7c6fdfafc2d547f58c006 HEAD -- '*.ts')
          node scripts/run-oxlint.mjs --tsconfig tsconfig.core.json "${touched[@]}"
          pnpm exec oxfmt --check "${touched[@]}" .github/workflows/proof-lane-d-row16.yml
      - name: Validate changed proof workflow
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: pnpm check:workflows
      - name: Full six-exchange real Gateway cold replay and source-deletion durability
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        env:
          OPENCLAW_VITEST_RUNTIME: node
          OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
          OPENCLAW_E2E_WORKERS: "1"
          OPENCLAW_E2E_VERBOSE: "1"
          ROW16_PROOF_OUTPUT: ${{ runner.temp }}/row16-proof
        run: pnpm test:e2e:gateway test/lane-d-row16-image-replay.e2e.test.ts
      - name: Preserve completed proof or setup-failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: row16-human-image-replay-${{ github.sha }}
          path: ${{ runner.temp }}/row16-proof/
          if-no-files-found: error
          retention-days: 7
