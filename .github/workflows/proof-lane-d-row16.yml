name: Lane D row16 human image replay proof
on:
  push:
    branches: ["proof/lane-d-row16-baseline-20261103"]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Standard pinned Node and dependencies
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          node-version: "24.22.1"
          install-bun: "true"
      - name: Record exact source identity
        run: |
          mkdir -p "$RUNNER_TEMP/row16-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/row16-proof/head.txt"
          git show -s --format=fuller HEAD > "$RUNNER_TEMP/row16-proof/commit.txt"
          sha256sum test/lane-d-row16-image-replay.e2e.test.ts src/agents/embedded-agent-runner/run/prompt-image-preparation.ts src/agents/embedded-agent-runner/run/images.ts > "$RUNNER_TEMP/row16-proof/source-sha256.txt"
      - name: Prepare canonical stamped runtime and AI package
        run: node scripts/prepare-vitest-runtime.mjs --with-ai-package
      - name: Real Gateway initial request and cold durable replay
        env:
          OPENCLAW_VITEST_RUNTIME: node
          OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
          OPENCLAW_E2E_WORKERS: "1"
          OPENCLAW_E2E_VERBOSE: "1"
          ROW16_PROOF_OUTPUT: ${{ runner.temp }}/row16-proof
        run: pnpm test:e2e:gateway test/lane-d-row16-image-replay.e2e.test.ts
      - name: Preserve completed proof or setup-failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: row16-human-image-replay-${{ github.sha }}
          path: ${{ runner.temp }}/row16-proof/
          if-no-files-found: error
          retention-days: 7
