name: Clock-pass exact-head format lint types
on:
  push:
    branches: [proof/clock-pass-exact-gates-20261121]
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: 17f8095a6331cd75a07424075c102a9fa152c823
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          cache-mode: "off"
      - name: Check all own-change formatting and final sandbox model request
        env:
          OPENCLAW_VITEST_RUNTIME: node
          ROW_A_RECEIPTS_DIR: ${{ runner.temp }}/clock-pass-format-exact
        run: |
          set -euo pipefail
          mkdir -p "$ROW_A_RECEIPTS_DIR"
          git rev-parse HEAD > "$ROW_A_RECEIPTS_DIR/owner-head.txt"
          git fetch --no-tags --depth=1 origin c7f0d533696fbc7a140614cf84f1961f186a6012
          mapfile -t files < <(git diff --name-only c7f0d533696fbc7a140614cf84f1961f186a6012 HEAD -- '*.ts' '*.mjs' '*.mts')
          printf '%s\n' "${files[@]}" > "$ROW_A_RECEIPTS_DIR/changed-source-files.txt"
          sha256sum "${files[@]}" > "$ROW_A_RECEIPTS_DIR/before.sha256"
          set +e
          corepack pnpm exec oxfmt --check "${files[@]}" 2>&1 | tee "$ROW_A_RECEIPTS_DIR/format-check.log"
          format_status=${PIPESTATUS[0]}
          echo "$format_status" > "$ROW_A_RECEIPTS_DIR/format.exit"
          if [ "$format_status" != 0 ]; then exit "$format_status"; fi
          node scripts/run-vitest.mjs src/logging/redact-patterns.test.ts src/logging/redact-byte-identity.test.ts src/logging/redact.test.ts --maxWorkers=1 2>&1 | tee "$ROW_A_RECEIPTS_DIR/exact-tests.log"
          exact_status=${PIPESTATUS[0]}
          echo "$exact_status" > "$ROW_A_RECEIPTS_DIR/exact.exit"
          if [ "$exact_status" != 0 ]; then exit "$exact_status"; fi
          set -e
          sha256sum "${files[@]}" > "$ROW_A_RECEIPTS_DIR/after.sha256"
          cmp "$ROW_A_RECEIPTS_DIR/before.sha256" "$ROW_A_RECEIPTS_DIR/after.sha256"
          git diff --exit-code HEAD
          git rev-parse HEAD > "$ROW_A_RECEIPTS_DIR/final-head.txt"
      - name: Native touched-file core lint then production and test types
        env:
          ROW_A_RECEIPTS_DIR: ${{ runner.temp }}/clock-pass-format-exact
          GOMAXPROCS: "2"
        run: |
          set -euo pipefail
          files_json=$(python3 -c 'import pathlib,json,os; print(json.dumps([p for p in pathlib.Path(os.environ["ROW_A_RECEIPTS_DIR"]).joinpath("changed-source-files.txt").read_text().splitlines() if p.startswith(("src/", "ui/", "packages/"))]))')
          set +e
          node --import tsx scripts/run-oxlint-shards.mts --only=core --split-core --threads=1 --files-json "$files_json" 2>&1 | tee "$ROW_A_RECEIPTS_DIR/native-lint.log"
          lint_status=${PIPESTATUS[0]}
          echo "$lint_status" > "$ROW_A_RECEIPTS_DIR/native-lint.exit"
          if [ "$lint_status" != 0 ]; then exit "$lint_status"; fi
          corepack pnpm tsgo:core 2>&1 | tee "$ROW_A_RECEIPTS_DIR/core.log"
          core_status=${PIPESTATUS[0]}
          echo "$core_status" > "$ROW_A_RECEIPTS_DIR/core.exit"
          if [ "$core_status" != 0 ]; then exit "$core_status"; fi
          corepack pnpm tsgo:core:test 2>&1 | tee "$ROW_A_RECEIPTS_DIR/core-test.log"
          test_status=${PIPESTATUS[0]}
          echo "$test_status" > "$ROW_A_RECEIPTS_DIR/core-test.exit"
          git rev-parse HEAD > "$ROW_A_RECEIPTS_DIR/types-final-head.txt"
          exit "$test_status"
      - name: Preserve final proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: clock-pass-format-exact-${{ github.sha }}
          path: ${{ runner.temp }}/clock-pass-format-exact
          if-no-files-found: error
          retention-days: 30
