name: Clock-pass type-first final proof and exact gates
on:
  push:
    branches: [proof/clock-pass-type-first-final-20261121]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve paired harness and check out product
        run: |
          set -euo pipefail
          cp -r scripts/clock-pass-proof "$RUNNER_TEMP/clock-pass-harness"
          git checkout --detach 28ffa795b705a1c2322822fec87ad094e6cc3da5
          echo CHECKOUT_SHA=$(git rev-parse HEAD)
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          cache-mode: "off"
      - name: Format native touched lint and production types BEFORE any proof
        env:
          RECEIPTS: ${{ runner.temp }}/clock-pass-type-repair/preflight
          GOMAXPROCS: "2"
        run: |
          set -euo pipefail
          mkdir -p "$RECEIPTS"
          git rev-parse HEAD > "$RECEIPTS/owner-head.txt"
          printf '%s\n' src/logging/redact-patterns.ts src/logging/redact-patterns.test.ts > "$RECEIPTS/changed-source-files.txt"
          sha256sum src/logging/redact-patterns.ts src/logging/redact-patterns.test.ts > "$RECEIPTS/before.sha256"
          run_gate() {
            local name="$1"; shift
            set +e
            "$@" 2>&1 | tee "$RECEIPTS/$name.log"
            local status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$RECEIPTS/$name.exit"
            if [ "$status" != 0 ]; then exit "$status"; fi
          }
          run_gate format corepack pnpm exec oxfmt --check src/logging/redact-patterns.ts src/logging/redact-patterns.test.ts
          run_gate native-lint node --import ./scripts/tsx.mjs scripts/run-oxlint-shards.mts --only=core --split-core --threads=1 --files-json '["src/logging/redact-patterns.ts","src/logging/redact-patterns.test.ts"]'
          run_gate production-types corepack pnpm tsgo:core
          git diff --exit-code HEAD
          git rev-parse HEAD > "$RECEIPTS/final-head.txt"
      - name: Paired owning suites and conservative controls
        env:
          PRODUCT: 28ffa795b705a1c2322822fec87ad094e6cc3da5
          BASE: c7f0d533696fbc7a140614cf84f1961f186a6012
          RECEIPTS: ${{ runner.temp }}/clock-pass-type-repair/paired
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/clock-pass-harness/runner.py"
      - name: Remaining exact-head chain AFTER qualified paired proof
        env:
          RECEIPTS: ${{ runner.temp }}/clock-pass-type-repair/exact
          OPENCLAW_VITEST_RUNTIME: node
          GOMAXPROCS: "2"
        run: |
          set -euo pipefail
          mkdir -p "$RECEIPTS"
          test "$(git rev-parse HEAD)" = 28ffa795b705a1c2322822fec87ad094e6cc3da5
          git diff --exit-code HEAD
          git rev-parse HEAD > "$RECEIPTS/owner-head.txt"
          run_gate() {
            local name="$1"; shift
            set +e
            "$@" 2>&1 | tee "$RECEIPTS/$name.log"
            local status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$RECEIPTS/$name.exit"
            if [ "$status" != 0 ]; then exit "$status"; fi
          }
          run_gate exact-tests node scripts/run-vitest.mjs src/logging/redact-patterns.test.ts src/logging/redact-byte-identity.test.ts src/logging/redact.test.ts --maxWorkers=1
          run_gate core-test-types corepack pnpm tsgo:core:test
          sha256sum src/logging/redact-patterns.ts src/logging/redact-patterns.test.ts > "$RECEIPTS/after.sha256"
          cmp "$RUNNER_TEMP/clock-pass-type-repair/preflight/before.sha256" "$RECEIPTS/after.sha256"
          git diff --exit-code HEAD
          git rev-parse HEAD > "$RECEIPTS/final-head.txt"
      - name: Preserve actual proof exits
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: clock-pass-type-first-${{ github.sha }}
          path: ${{ runner.temp }}/clock-pass-type-repair
          if-no-files-found: error
          retention-days: 30
