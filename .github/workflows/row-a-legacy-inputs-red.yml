name: Row A legacy reader inputs RED
on:
  push:
    branches: [proof/row-a-legacy-inputs-red-20261120]
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Preflight tests exist in proof tree
        run: |
          set -euo pipefail
          test -s src/skills/runtime/sandbox-v8-library.integration.test.ts
          test -s src/skills/runtime/separated-recovery.integration.test.ts
          test -s src/skills/runtime/legacy-precedence.integration.test.ts
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          cache-mode: "off"
      - name: Materialized sandbox model-request regression
        env:
          OPENCLAW_VITEST_RUNTIME: node
          ROW_A_RECEIPTS_DIR: ${{ runner.temp }}/row-a-legacy-inputs-red
        run: |
          set -euo pipefail
          mkdir -p "$ROW_A_RECEIPTS_DIR"
          git rev-parse HEAD > "$ROW_A_RECEIPTS_DIR/owner-head.txt"
          sha256sum src/skills/runtime/separated-recovery.integration.test.ts > "$ROW_A_RECEIPTS_DIR/harness.sha256"
          node scripts/run-vitest.mjs src/skills/runtime/legacy-precedence.integration.test.ts src/skills/runtime/separated-recovery.integration.test.ts --maxWorkers=1 2>&1 | tee "$ROW_A_RECEIPTS_DIR/test.log"
      - name: Preserve receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: row-a-legacy-inputs-red-${{ github.sha }}
          path: ${{ runner.temp }}/row-a-legacy-inputs-red
          if-no-files-found: error
          retention-days: 30
